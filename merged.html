vDumpState\"\u003e填入当前状态\u003c/button\u003e\u003c/div\u003e\n                  \u003c/div\u003e\n                \u003c/div\u003e\n                \u003cdiv class=\"dev-section\"\u003e\n                  \u003cdiv class=\"dev-section-title\"\u003e运行时 JS\u003c/div\u003e\n                  \u003cdiv class=\"dev-section-body\"\u003e\n                    \u003ctextarea id=\"devScriptText\" spellcheck=\"false\"\u003eGameState.playTime = 0;\nGameState.currentQuest = \"quest_start\";\u003c/textarea\u003e\n                    \u003cbutton id=\"devRunScript\" class=\"primary\"\u003e运行 JS\u003c/button\u003e\n                  \u003c/div\u003e\n                \u003c/div\u003e\n                \u003cdiv class=\"dev-section\"\u003e\n                  \u003cdiv class=\"dev-section-title\"\u003e调试日志\u003c/div\u003e\n                  \u003cdiv class=\"dev-section-body\"\u003e\u003cdiv id=\"devLog\" class=\"dev-log\"\u003e\u003c/div\u003e\u003c/div\u003e\n                \u003c/div\u003e\n              \u003c/section\u003e\n            \u003c/main\u003e\n          \u003c/aside\u003e\n          \u003csection class=\"dev-stage\"\u003e\n            \u003cdiv class=\"dev-stage-card\"\u003e\u003cstrong id=\"devStageTitle\"\u003e当前游戏运行时\u003c/strong\u003e\u003cspan id=\"devStageSubtitle\"\u003e所有修改直接作用于当前正式页面。\u003c/span\u003e\u003c/div\u003e\n          \u003c/section\u003e\n        `;\n        document.body.appendChild(root);\n        root.addEventListener(\"pointerdown\", stopGameInput, true);\n        root.addEventListener(\"mousedown\", stopGameInput, true);\n        root.addEventListener(\"touchstart\", stopGameInput, true);\n        bindTool();\n        renderStaticControls();\n      }\n\n      function stopGameInput(event) {\n        event.stopPropagation();\n      }\n\n      function setToolOpen(open) {\n        if (!root) {\n          createTool();\n        }\n        root.classList.toggle(\"dev-open\", open);\n        if (open) {\n          devClearInput();\n          root.focus();\n          refreshState();\n          if (!refreshTimer) {\n            refreshTimer = window.setInterval(refreshState, REFRESH_MS);\n          }\n        } else {\n          devClearInput();\n          if (refreshTimer) {\n            window.clearInterval(refreshTimer);\n            refreshTimer = null;\n          }\n        }\n      }\n\n      function handleTrigger(event) {\n        if (root \u0026\u0026 root.classList.contains(\"dev-open\")) {\n          if (event.key === \"Escape\") {\n            setToolOpen(false);\n            event.preventDefault();\n          }\n          event.stopImmediatePropagation();\n          return;\n        }\n\n        if (!isSixKey(event) || isEditableTarget(event.target)) {\n          return;\n        }\n\n        const now = Date.now();\n        sixPressTimes = sixPressTimes.filter((time) =\u003e now - time \u003c= TRIGGER_WINDOW_MS);\n        sixPressTimes.push(now);\n        if (sixPressTimes.length \u003e= 3) {\n          sixPressTimes = [];\n          setToolOpen(true);\n          event.preventDefault();\n          event.stopImmediatePropagation();\n        }\n      }\n\n      function devRestartLoop() {\n        try {\n          if (typeof loopStopped !== \"undefined\" \u0026\u0026 loopStopped) {\n            loopStopped = false;\n            lastTimestamp = performance.now();\n            requestAnimationFrame(safeGameLoop);\n          }\n        } catch (error) {}\n      }\n\n      function devClearInput() {\n        try {\n          InputSystem.keys = Object.create(null);\n          InputSystem.pressed = Object.create(null);\n          InputSystem.pointerPressed = false;\n          InputSystem.pointerJustPressed = false;\n          InputSystem.joystick.active = false;\n          InputSystem.joystick.vectorX = 0;\n          InputSystem.joystick.vectorY = 0;\n          InputSystem.actionButton.held = false;\n          InputSystem.actionButton.justPressed = false;\n        } catch (error) {}\n      }\n\n      function devClearDialogue() {\n        try {\n          DialogueSystem.active = false;\n          DialogueSystem.lines = [];\n          DialogueSystem.index = 0;\n          DialogueSystem.justStarted = false;\n          DialogueSystem.revealTimer = 0;\n        } catch (error) {}\n      }\n\n      function devResetTransient() {\n        devRestartLoop();\n        devClearInput();\n        devClearDialogue();\n        GameState.fatalError = null;\n        GameState.failReason = \"\";\n        GameState.failRecovery = null;\n        GameState.redDialogueActive = false;\n        GameState.brooksDialogueActive = false;\n        GameState.postMontageRedDialogueActive = false;\n        GameState.player.lyingInBed = false;\n        GameState.player.vx = 0;\n        GameState.player.vy = 0;\n        GameState.player.isMoving = false;\n        GameState.player.walkAnimTime = 0;\n        GameState.wallHole.revealed = false;\n        GameState.wallHole.introPending = false;\n        GameState.wallHole.exitPending = false;\n        GameState.wallHole.timer = 0;\n        GameState.dig.isDigging = false;\n        GameState.dig.digAnimTime = 0;\n        GameState.dig.pipeEntryTimer = 0;\n        GameState.pipe.isSmashing = false;\n        GameState.pipe.smashAnimTime = 0;\n        GameState.soilDump.progress = 0;\n        GameState.soilDump.active = false;\n        try { resetCellInspectionState(); } catch (error) {}\n        try { resetOfficeSceneState(); } catch (error) {}\n        try { resetYardGuardsForSoilRetry(); } catch (error) {}\n        if (GameState.redNpc) {\n          GameState.redNpc.initialized = false;\n          GameState.redNpc.mode = \"patrol\";\n          GameState.redNpc.pendingDialogue = null;\n          GameState.redNpc.isMoving = false;\n          GameState.redNpc.walkAnimTime = 0;\n        }\n      }\n\n      function devSetProgress(flags) {\n        devResetTransient();\n        const defaults = {\n          hasHammer: false,\n          hasBible: false,\n          hasLedger: false,\n          hasSoilPile: false,\n          bibleUsed: false,\n          ledgerFound: false,\n          ledgerSwapped: false,\n          finalDigUnlocked: false,\n          inspectionPassed: false,\n          hasAttributeC: false,\n          hasAttributeD: false,\n          twentyYearsPassed: false,\n          postMontageRedSpoken: false,\n          mapRevealActive: false,\n          mapDrawn: false,\n          hasMap: false,\n          redHammerDelivered: false,\n          brooksBibleDelivered: false\n        };\n        Object.keys(defaults).forEach(function (key) {\n          GameState[key] = Object.prototype.hasOwnProperty.call(flags, key) ? flags[key] : defaults[key];\n        });\n        GameState.dig.digProgress = 0;\n        GameState.soilDump.completedCount = 0;\n        GameState.currentQuest = \"quest_start\";\n      }\n\n      function devCheckpoint(key) {\n        GameState.currentCheckpoint = key;\n        try {\n          localStorage.setItem(\"shawshank_pixel_escape_checkpoint\", key);\n        } catch (error) {}\n      }\n\n      function devEnterScene(sceneName) {\n        if (!Scenes[sceneName]) {\n          throw new Error(\"Scene not found: \" + sceneName);\n        }\n        devClearInput();\n        devClearDialogue();\n        const previous = GameState.scene;\n        if (previous !== sceneName \u0026\u0026 typeof changeScene === \"function\") {\n          changeScene(sceneName);\n          return;\n        }\n        GameState.previousScene = previous;\n        GameState.scene = sceneName;\n        if (Scenes[sceneName] \u0026\u0026 Scenes[sceneName].enter) {\n          Scenes[sceneName].enter();\n        }\n      }\n\n      function devMerge(target, patch) {\n        Object.keys(patch).forEach(function (key) {\n          const value = patch[key];\n          if (value \u0026\u0026 typeof value === \"object\" \u0026\u0026 !Array.isArray(value) \u0026\u0026 target[key] \u0026\u0026 typeof target[key] === \"object\" \u0026\u0026 !Array.isArray(target[key])) {\n            devMerge(target[key], value);\n          } else {\n            target[key] = value;\n          }\n        });\n        return target;\n      }\n\n      function safe(fn, fallback) {\n        try { return fn(); } catch (error) { return fallback; }\n      }\n\n      function readState() {\n        if (typeof GameState === \"undefined\") {\n          return { ready: false };\n        }\n        const activeInteraction = safe(function () {\n          if (GameState.scene === \"cell\") return getActiveCellInteraction();\n          if (GameState.scene === \"yard\") return getActiveYardInteraction();\n          if (GameState.scene === \"office\") return getActiveOfficeInteraction();\n          if (GameState.scene === \"dig\") return getActiveDigInteraction();\n          if (GameState.scene === \"pipe\") return getActivePipeInteraction();\n          return null;\n        }, null);\n        return {\n          ready: true,\n          scene: GameState.scene,\n          quest: GameState.currentQuest,\n          questText: safe(function () { return QuestSystem.getCurrentText(); }, GameState.currentQuest),\n          checkpoint: GameState.currentCheckpoint,\n          playTime: Math.round(GameState.playTime),\n          fatalError: GameState.fatalError ? String(GameState.fatalError.message || GameState.fatalError) : \"\",\n          failReason: GameState.failReason || \"\",\n          activeInteraction: activeInteraction ? activeInteraction.id : \"\",\n          player: { x: Math.round(GameState.player.x), y: Math.round(GameState.player.y), facing: GameState.player.facing },\n          dig: { mode: GameState.dig.mode, progress: Number(GameState.dig.digProgress || 0).toFixed(2), x: Math.round(GameState.dig.playerX || 0), y: Math.round(GameState.dig.playerY || 0) },\n          soilDump: { progress: Number(GameState.soilDump.progress || 0).toFixed(2), completedCount: GameState.soilDump.completedCount },\n          office: { wardenPhase: GameState.office.wardenPhase, safeStage: GameState.office.safeStage, safeViewOpen: GameState.office.safeViewOpen },\n          pipe: {\n            x: Math.round(GameState.pipe.playerX || 0),\n            y: Math.round(GameState.pipe.playerY || 0),\n            phase: GameState.pipe.phase,\n            hits: GameState.pipe.smashSuccessCount,\n            requiredHits: typeof PIPE_SMASH_REQUIRED_COUNT === \"undefined\" ? 0 : PIPE_SMASH_REQUIRED_COUNT,\n            cueVisible: GameState.pipe.cueVisible,\n            cueLit: GameState.pipe.cueLit,\n            smashCompleted: GameState.pipe.smashCompleted,\n            victoryPhase: GameState.pipe.victoryPhase\n          },\n          flags: FLAG_KEYS.reduce(function (result, key) {\n            result[key] = Boolean(GameState[key]);\n            return result;\n          }, {}),\n          raw: GameState\n        };\n      }\n\n      function runCode(label, code) {\n        try {\n          eval(code);\n          devRestartLoop();\n          log(\"OK \" + label);\n          refreshState();\n        } catch (error) {\n          log(\"ERR \" + label + \": \" + (error \u0026\u0026 error.message ? error.message : error));\n          setReady(false, \"执行失败\");\n        }\n      }\n\n      function setReady(value, text) {\n        const dot = document.getElementById(\"devReadyDot\");\n        const readyText = document.getElementById(\"devReadyText\");\n        if (dot) dot.className = value ? \"dev-dot ready\" : \"dev-dot\";\n        if (readyText) readyText.textContent = text;\n      }\n\n      function log(message) {\n        const logBox = document.getElementById(\"devLog\");\n        if (!logBox) return;\n        const time = new Date().toLocaleTimeString();\n        logBox.textContent = \"[\" + time + \"] \" + message + \"\\n\" + logBox.textContent;\n      }\n\n      function escapeHtml(value) {\n        return String(value)\n          .replace(/\u0026/g, \"\u0026amp;\")\n          .replace(/\u003c/g, \"\u0026lt;\")\n          .replace(/\u003e/g, \"\u0026gt;\")\n          .replace(/\"/g, \"\u0026quot;\");\n      }\n\n      function renderButtonList(id, items, tagText) {\n        const list = document.getElementById(id);\n        list.innerHTML = \"\";\n        items.forEach(function (item) {\n          const button = document.createElement(\"button\");\n          button.className = \"dev-preset\";\n          button.innerHTML = \"\u003cspan\u003e\u003cstrong\u003e\" + escapeHtml(item.title) + \"\u003c/strong\u003e\u003cspan\u003e\" + escapeHtml(item.note || \"\") + \"\u003c/span\u003e\u003c/span\u003e\u003cem class=\\\"dev-tag\\\"\u003e\" + escapeHtml(tagText || item.group || \"\") + \"\u003c/em\u003e\";\n          button.addEventListener(\"click\", function () {\n            runCode(item.title, item.code);\n          });\n          list.appendChild(button);\n        });\n      }\n\n      function renderStaticControls() {\n        renderButtonList(\"devPresetList\", PRESETS);\n        renderButtonList(\"devTeleportList\", TELEPORTS, \"移动\");\n        const shortcutList = document.getElementById(\"devShortcutList\");\n        shortcutList.innerHTML = \"\";\n        SHORTCUTS.forEach(function (item) {\n          const button = document.createElement(\"button\");\n          button.textContent = item.title;\n          button.addEventListener(\"click\", function () {\n            runCode(item.title, item.code);\n          });\n          shortcutList.appendChild(button);\n        });\n        document.getElementById(\"devSceneSelect\").innerHTML = RAW_SCENES.map(function (scene) {\n          return \"\u003coption value=\\\"\" + scene + \"\\\"\u003e\" + scene + \"\u003c/option\u003e\";\n        }).join(\"\");\n        document.getElementById(\"devCheckpointSelect\").innerHTML = CHECKPOINTS.map(function (checkpoint) {\n          return \"\u003coption value=\\\"\" + checkpoint + \"\\\"\u003e\" + checkpoint + \"\u003c/option\u003e\";\n        }).join(\"\");\n      }\n\n      function renderFlags(flags) {\n        if (flagsDirty) return;\n        const flagList = document.getElementById(\"devFlagList\");\n        flagList.innerHTML = \"\";\n        FLAG_KEYS.forEach(function (key) {\n          const label = document.createElement(\"label\");\n          label.className = \"dev-flag\";\n          label.innerHTML = \"\u003cinput type=\\\"checkbox\\\" data-flag=\\\"\" + key + \"\\\"\u003e \u003cspan\u003e\" + key + \"\u003c/span\u003e\";\n          const input = label.querySelector(\"input\");\n          input.checked = Boolean(flags \u0026\u0026 flags[key]);\n          input.addEventListener(\"change\", function () {\n            flagsDirty = true;\n          });\n          flagList.appendChild(label);\n        });\n      }\n\n      function refreshState() {\n        if (!root || !root.classList.contains(\"dev-open\")) return;\n        const state = readState();\n        if (!state.ready) {\n          setReady(false, \"等待 GameState\");\n          return;\n        }\n        const rows = [\n          [\"scene\", state.scene],\n          [\"quest\", state.quest],\n          [\"questText\", state.questText],\n          [\"checkpoint\", state.checkpoint],\n          [\"active\", state.activeInteraction || \"none\"],\n          [\"player\", state.player.x + \",\" + state.player.y + \" / \" + state.player.facing],\n          [\"dig\", state.dig.mode + \" / \" + state.dig.progress],\n          [\"soil\", state.soilDump.completedCount + \"/3 / \" + state.soilDump.progress],\n          [\"office\", state.office.wardenPhase + \" / \" + state.office.safeStage],\n          [\"pipe\", state.pipe.phase + \" / \" + state.pipe.hits + \"/\" + state.pipe.requiredHits + \" / cue \" + (state.pipe.cueLit ? \"lit\" : state.pipe.cueVisible ? \"wait\" : \"off\") + \" / \" + state.pipe.x + \",\" + state.pipe.y + (state.pipe.smashCompleted ? \" / opened\" : \"\") + (state.pipe.victoryPhase \u0026\u0026 state.pipe.victoryPhase !== \"none\" ? \" / victory \" + state.pipe.victoryPhase : \"\")],\n          [\"fail\", state.failReason || \"none\"],\n          [\"playTime\", state.playTime + \"s\"]\n        ];\n        document.getElementById(\"devStateSummary\").innerHTML = rows.map(function (row) {\n          return \"\u003cdt\u003e\" + escapeHtml(row[0]) + \"\u003c/dt\u003e\u003cdd\u003e\" + escapeHtml(String(row[1])) + \"\u003c/dd\u003e\";\n        }).join(\"\");\n        renderFlags(state.flags);\n        document.getElementById(\"devStageTitle\").textContent = \"scene: \" + state.scene + \" | checkpoint: \" + state.checkpoint;\n        document.getElementById(\"devStageSubtitle\").textContent = state.questText || state.quest;\n        document.getElementById(\"devSceneSelect\").value = state.scene;\n        document.getElementById(\"devCheckpointSelect\").value = CHECKPOINTS.indexOf(state.checkpoint) \u003e= 0 ? state.checkpoint : \"CP_START\";\n        setReady(!state.fatalError, state.fatalError ? \"游戏报错：\" + state.fatalError : \"已连接 GameState\");\n      }\n\n      function applyFlagForm() {\n        const patch = {};\n        document.querySelectorAll(\"#devFlagList input[data-flag]\").forEach(function (input) {\n          patch[input.dataset.flag] = input.checked;\n        });\n        flagsDirty = false;\n        Object.keys(patch).forEach(function (key) {\n          GameState[key] = patch[key];\n        });\n        log(\"OK 应用旗标\");\n        refreshState();\n      }\n\n      function applyJsonPatch() {\n        try {\n          const patch = JSON.parse(document.getElementById(\"devPatchText\").value);\n          devMerge(GameState, patch);\n          log(\"OK JSON 补丁\");\n          refreshState();\n        } catch (error) {\n          log(\"ERR JSON 格式错误: \" + (error \u0026\u0026 error.message ? error.message : error));\n        }\n      }\n\n      function dumpStateToPatch() {\n        try {\n          document.getElementById(\"devPatchText\").value = JSON.stringify(readState().raw, null, 2);\n          log(\"OK 已填入当前 GameState\");\n        } catch (error) {\n          log(\"ERR 读取状态失败: \" + (error \u0026\u0026 error.message ? error.message : error));\n        }\n      }\n\n      function bindTool() {\n        document.getElementById(\"devClose\").addEventListener(\"click\", function () { setToolOpen(false); });\n        document.querySelectorAll(\".dev-tab\").forEach(function (tab) {\n          tab.addEventListener(\"click\", function () {\n            activePane = tab.dataset.pane;\n            document.querySelectorAll(\".dev-tab\").forEach(function (item) {\n              item.classList.toggle(\"active\", item === tab);\n            });\n            document.querySelectorAll(\".dev-pane\").forEach(function (pane) {\n              pane.classList.toggle(\"active\", pane.id === \"devPane-\" + activePane);\n            });\n          });\n        });\n        document.getElementById(\"devRefreshProgress\").addEventListener(\"click\", refreshState);\n        document.getElementById(\"devRefreshState\").addEventListener(\"click\", refreshState);\n        document.getElementById(\"devSceneButton\").addEventListener(\"click\", function () {\n          runCode(\"切场景 \" + document.getElementById(\"devSceneSelect\").value, \"devEnterScene(\" + JSON.stringify(document.getElementById(\"devSceneSelect\").value) + \");\");\n        });\n        document.getElementById(\"devCheckpointButton\").addEventListener(\"click\", function () {\n          const checkpoint = document.getElementById(\"devCheckpointSelect\").value;\n          devCheckpoint(checkpoint);\n          log(\"OK 保存检查点 \" + checkpoint);\n          refreshState();\n        });\n        document.getElementById(\"devApplyFlags\").addEventListener(\"click\", applyFlagForm);\n        document.getElementById(\"devApplyPatch\").addEventListener(\"click\", applyJsonPatch);\n        document.getElementById(\"devDumpState\").addEventListener(\"click\", dumpStateToPatch);\n        document.getElementById(\"devRunScript\").addEventListener(\"click\", function () {\n          runCode(\"运行时 JS\", document.getElementById(\"devScriptText\").value);\n        });\n      }\n\n      window.addEventListener(\"keydown\", handleTrigger, true);\n    })();\n  \u003c/script\u003e\n\u003cscript\u003e\n(function () {\n  \"use strict\";\n\n  const routeMap = {\n    \"ending.html\": \"endingSelect\",\n    \"../三个结局/ending.html\": \"endingSelect\",\n    \"ending1/shawshank_storyboard_interactive.html\": \"ending1\",\n    \"../三个结局/ending1/shawshank_storyboard_interactive.html\": \"ending1\",\n    \"ending2/ending2_shawshank_storyboard_interactive.html\": \"ending2\",\n    \"../三个结局/ending2/ending2_shawshank_storyboard_interactive.html\": \"ending2\",\n    \"ending3/shawshank_no_reunion_interactive_bgm.html\": \"ending3\",\n    \"../三个结局/ending3/shawshank_no_reunion_interactive_bgm.html\": \"ending3\"\n  };\n\n  function openMergedPage(page) {\n    parent.postMessage({ type: \"shawshank-merged-nav\", page }, \"*\");\n  }\n\n  document.addEventListener(\"click\", function (event) {\n    const link = event.target \u0026\u0026 event.target.closest ? event.target.closest(\"a[href]\") : null;\n    if (!link) return;\n    const page = routeMap[link.getAttribute(\"href\")];\n    if (!page) return;\n    event.preventDefault();\n    openMergedPage(page);\n  }, true);\n}());\n\u003c/script\u003e\n\u003c/body\u003e\n\u003c/html\u003e\n",

    "endingSelect":  {
                         "html":  "\u003c!DOCTYPE html\u003e\n\u003chtml lang=\"zh-CN\"\u003e\n\u003chead\u003e\n  \u003cbase href=\"三个结局/\"\u003e\n  \u003cmeta charset=\"UTF-8\"\u003e\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\u003e\n  \u003ctitle\u003e肖申克的救赎 - 结局选择\u003c/title\u003e\n  \u003cstyle\u003e\n    * {\n      box-sizing: border-box;\n    }\n\n    html,\n    body {\n      width: 100%;\n      min-height: 100%;\n      margin: 0;\n      background: #000;\n      color: #f5f1e8;\n      font-family: \"Microsoft YaHei\", \"PingFang SC\", Arial, sans-serif;\n    }\n\n    body {\n      min-height: 100vh;\n      display: flex;\n      align-items: center;\n      justify-content: center;\n      padding: 40px 28px;\n    }\n\n    .ending-row {\n      width: min(1320px, 100%);\n      display: grid;\n      grid-template-columns: repeat(3, minmax(0, 1fr));\n      gap: 24px;\n    }\n\n    .ending-card {\n      min-height: 300px;\n      display: flex;\n      align-items: center;\n      justify-content: center;\n      padding: 30px 26px;\n      border: 1px solid rgba(245, 241, 232, 0.58);\n      border-radius: 6px;\n      color: inherit;\n      text-decoration: none;\n      background:\n        linear-gradient(180deg, rgba(255, 255, 255, 0.075), rgba(255, 255, 255, 0.018)),\n        #050505;\n      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06), 0 16px 40px rgba(0, 0, 0, 0.55);\n      transition: transform 180ms ease, border-color 180ms ease, background 180ms ease;\n    }\n\n    .ending-card:hover,\n    .ending-card:focus-visible {\n      transform: translateY(-5px);\n      border-color: #f5f1e8;\n      background:\n        linear-gradient(180deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.035)),\n        #080808;\n      outline: none;\n    }\n\n    .ending-card p {\n      margin: 0;\n      max-width: 33em;\n      font-size: clamp(18px, 1.45vw, 24px);\n      line-height: 1.9;\n      letter-spacing: 0;\n      text-align: justify;\n      text-justify: inter-ideograph;\n    }\n\n    @media (max-width: 920px) {\n      body {\n        align-items: flex-start;\n        padding: 24px 18px;\n      }\n\n      .ending-row {\n        grid-template-columns: 1fr;\n        gap: 18px;\n      }\n\n      .ending-card {\n        min-height: 220px;\n      }\n    }\n  \u003c/style\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n  \u003caudio id=\"gameBgm\" src=\"../shawshank_pixel_escape/audio/end_title.mp3\" loop preload=\"auto\"\u003e\u003c/audio\u003e\n\n  \u003cmain class=\"ending-row\" aria-label=\"肖申克的救赎三个结局入口\"\u003e\n    \u003ca class=\"ending-card\" href=\"ending1/shawshank_storyboard_interactive.html\"\u003e\n      \u003cp\u003e你由于含冤入狱，畏惧肖申克监狱的势力，没有举报典狱长，选择带着取出来的钱，和当年与瑞德约定的一样，在树下留了一封信，远赴墨西哥海滩……\u003c/p\u003e\n    \u003c/a\u003e\n\n    \u003ca class=\"ending-card\" href=\"ending2/ending2_shawshank_storyboard_interactive.html\"\u003e\n      \u003cp\u003e你搜集了所有典狱长利用别人洗黑钱和犯罪的证据，正义的你决定不计后果举报典狱长……\u003c/p\u003e\n    \u003c/a\u003e\n\n    \u003ca class=\"ending-card\" href=\"ending3/shawshank_no_reunion_interactive_bgm.html\"\u003e\n      \u003cp\u003e你经历了在监狱的多年，肉体和精神上的折磨使你无力再抗争，再关心他人，你选择隐姓埋名，独自开启自己的新生活……\u003c/p\u003e\n    \u003c/a\u003e\n  \u003c/main\u003e\n  \u003cscript\u003e\n    (function () {\n      \"use strict\";\n\n      var bgm = document.getElementById(\"gameBgm\");\n      if (!bgm) {\n        return;\n      }\n      var resumeKey = \"shawshank_game_bgm_time\";\n      var resumeTime = 0;\n\n      try {\n        resumeTime = Number(localStorage.getItem(resumeKey)) || 0;\n      } catch (error) {\n        resumeTime = 0;\n      }\n\n      function applyResumeTime() {\n        if (resumeTime \u003c= 0) {\n          return;\n        }\n        try {\n          bgm.currentTime = Number.isFinite(bgm.duration) \u0026\u0026 bgm.duration \u003e 0 ?\n            resumeTime % bgm.duration :\n            resumeTime;\n        } catch (error) {\n          // Some browsers disallow seeking before metadata is ready.\n        }\n      }\n\n      function playBgm() {\n        bgm.volume = 0.5;\n        var result = bgm.play();\n        if (result \u0026\u0026 typeof result.catch === \"function\") {\n          result.catch(function () {});\n        }\n      }\n\n      function stopBgm() {\n        bgm.pause();\n        try {\n          bgm.currentTime = 0;\n        } catch (error) {\n          // Some browsers disallow seeking before metadata is ready.\n        }\n        try {\n          localStorage.removeItem(resumeKey);\n        } catch (error) {\n          // Local saves can be unavailable in private or restricted browser modes.\n        }\n      }\n\n      if (bgm.readyState \u003e= 1) {\n        applyResumeTime();\n      } else {\n        bgm.addEventListener(\"loadedmetadata\", applyResumeTime, { once: true });\n      }\n      playBgm();\n      window.addEventListener(\"pointerdown\", playBgm, { once: true });\n      window.addEventListener(\"keydown\", playBgm, { once: true });\n\n      document.querySelectorAll(\".ending-card\").forEach(function (card) {\n        card.addEventListener(\"click\", stopBgm);\n      });\n    }());\n  \u003c/script\u003e\n\u003cscript\u003e\n(function () {\n  \"use strict\";\n\n  const routeMap = {\n    \"ending.html\": \"endingSelect\",\n    \"../三个结局/ending.html\": \"endingSelect\",\n    \"ending1/shawshank_storyboard_interactive.html\": \"ending1\",\n    \"../三个结局/ending1/shawshank_storyboard_interactive.html\": \"ending1\",\n    \"ending2/ending2_shawshank_storyboard_interactive.html\": \"ending2\",\n    \"../三个结局/ending2/ending2_shawshank_storyboard_interactive.html\": \"ending2\",\n    \"ending3/shawshank_no_reunion_interactive_bgm.html\": \"ending3\",\n    \"../三个结局/ending3/shawshank_no_reunion_interactive_bgm.html\": \"ending3\"\n  };\n\n  function openMergedPage(page) {\n    parent.postMessage({ type: \"shawshank-merged-nav\", page }, \"*\");\n  }\n\n  document.addEventListener(\"click\", function (event) {\n    const link = event.target \u0026\u0026 event.target.closest ? event.target.closest(\"a[href]\") : null;\n    if (!link) return;\n    const page = routeMap[link.getAttribute(\"href\")];\n    if (!page) return;\n    event.preventDefault();\n    openMergedPage(page);\n  }, true);\n}());\n\u003c/script\u003e\n\u003c/body\u003e\n\u003c/html\u003e\n",

    "ending1":  {
                    "html":  "\u003c!doctype html\u003e\n\u003chtml lang=\"zh-CN\"\u003e\n\u003chead\u003e\n  \u003cbase href=\"三个结局/ending1/\"\u003e\n  \u003cmeta charset=\"utf-8\" /\u003e\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\" /\u003e\n  \u003ctitle\u003e瑞德与安迪：自由分镜\u003c/title\u003e\n  \u003cstyle\u003e\n    :root {\n      color-scheme: dark;\n      --paper: #f5ead4;\n      --paper-ink: #402d1d;\n      --veil: #000;\n      --gold: #d9ad6a;\n      --blue: #7fc7ff;\n      --white: #f3ead8;\n      --caption-bg: rgba(33, 24, 16, .64);\n      --caption-border: rgba(215, 174, 113, .34);\n      --ease: cubic-bezier(.2,.8,.2,1);\n    }\n\n    * { box-sizing: border-box; }\n\n    html,\n    body {\n      margin: 0;\n      min-height: 100%;\r\n      height: 100%;\r\n      background: #030303;\n      font-family: \"Microsoft YaHei\", \"PingFang SC\", \"Noto Sans SC\", Arial, sans-serif;\n      color: var(--white);\n      overflow-x: hidden;\n    }\n\n    body {\n      display: grid;\n      place-items: center;\n      min-height: 100vh;\n      padding: clamp(12px, 2vw, 28px);\n    }\n\n    body.is-final-mode {\n      padding: 0;\n    }\n\n    .stage {\n      width: min(100vw - 24px, 1672px);\n      aspect-ratio: 1672 / 941;\n      position: relative;\n      background: #000;\n      cursor: pointer;\n      user-select: none;\n      overflow: hidden;\n      box-shadow: 0 18px 60px rgba(0, 0, 0, .62);\n    }\n\n    .stage.is-final {\n      width: 100vw;\n      height: 100vh;\n      aspect-ratio: auto;\n      box-shadow: none;\n    }\n\n    .stage:focus-visible {\n      outline: 1px solid rgba(217, 173, 106, .42);\n      outline-offset: 4px;\n    }\n\n    .panel {\n      position: absolute;\n      inset: 0;\n      overflow: hidden;\n      background: transparent;\n      transition: opacity 620ms var(--ease);\n    }\n\n    .panel::before {\n      content: \"\";\n      position: absolute;\n      inset: 0;\n      background-image: url(\"shawshank_storyboard.jpg\");\n      background-size: 100% 100%;\n      background-repeat: no-repeat;\n    }\n\n    .panel-1 { clip-path: polygon(0 0, 39.1% 0, 38.5% 6.8%, 37.6% 18.5%, 36.5% 31.6%, 33.4% 47.1%, 0 52.1%); }\n    .panel-2 { clip-path: polygon(0 50.2%, 33.4% 47.1%, 36.2% 61.4%, 37.9% 76.5%, 38.8% 90.8%, 39.1% 100%, 0 100%); }\n    .panel-3 { clip-path: polygon(39.1% 0, 70.6% 0, 69.7% 11.2%, 69.1% 25.4%, 68.1% 40.3%, 67% 49.5%, 35.2% 47.2%, 36.6% 37.8%, 38.2% 25%, 39.1% 12.2%); }\n    .panel-4 { clip-path: polygon(35.2% 47.2%, 67% 49.5%, 66.1% 60.3%, 65% 74.6%, 64% 89.6%, 63.2% 100%, 39.1% 100%, 38.3% 88.9%, 37% 74.2%, 35.5% 60.3%); }\n    .panel-5 { clip-path: polygon(70.6% 0, 100% 0, 100% 47.7%, 67% 51%, 68.1% 39.7%, 69.1% 25.1%, 69.7% 11.2%); }\n    .panel-6 { clip-path: polygon(67% 51%, 100% 47.7%, 100% 100%, 63.2% 100%, 64% 89.3%, 65% 74.5%, 66.1% 60.2%); }\n\n    .veil {\n      position: absolute;\n      inset: 0;\n      display: grid;\r\n      place-items: center;\n      background: var(--veil);\n      opacity: 1;\n      transition: opacity 520ms var(--ease), transform 520ms var(--ease);\n      z-index: 5;\n    }\n\n    .panel.is-revealed .veil {\n      opacity: 0;\n      transform: scale(1.04);\n      pointer-events: none;\n    }\n\n    .lock {\n      display: none;\n    }\n\n    .caption {\n      position: absolute;\n      z-index: 7;\n      max-width: min(29vw, 440px);\n      padding: clamp(10px, .95vw, 15px) clamp(13px, 1.2vw, 20px);\n      border: 1px solid var(--caption-border);\n      border-top-color: rgba(234, 199, 143, .44);\n      border-radius: 4px;\n      background:\n        linear-gradient(180deg, rgba(221, 178, 112, .12), rgba(58, 37, 20, .08)),\n        var(--caption-bg);\n      backdrop-filter: blur(4px) saturate(.95);\n      -webkit-backdrop-filter: blur(4px) saturate(.95);\n      color: var(--white);\n      font-size: clamp(12px, 1vw, 18px);\n      line-height: 1.62;\n      letter-spacing: 0;\n      text-shadow: 0 2px 6px rgba(0,0,0,.78);\n      box-shadow: 0 10px 24px rgba(0,0,0,.28), inset 0 1px 0 rgba(255, 238, 204, .09);\n      opacity: 0;\n      transform: translateY(12px);\n      transition: opacity 420ms var(--ease), transform 420ms var(--ease);\n      transition-delay: 0ms;\n      pointer-events: none;\n    }\n\n    .panel-1 .caption { left: 5%; top: 31%; max-width: 28%; }\n    .panel-2 .caption { left: 6.2%; bottom: 7.8%; max-width: 24%; }\n    .panel-3 .caption { left: 43%; top: 11.5%; max-width: 20%; }\n    .panel-4 .caption { left: 42.2%; top: 53%; max-width: 20%; }\n    .panel-5 .caption { right: 5.4%; top: 9%; max-width: 23%; }\n    .panel-6 .caption { right: 6.2%; bottom: 8.8%; max-width: 22%; }\n\n    .panel.is-current .caption {\n      opacity: 1;\n      transform: translateY(0);\n      transition-delay: 620ms;\n    }\n\n    .panel.is-past .caption {\n      opacity: 1;\n      transform: translateY(0);\n    }\n\n    .note {\n      position: absolute;\n      left: 50%;\n      top: 50%;\n      z-index: 20;\n      width: min(58%, 760px);\n      transform: translate(-50%, -50%) scale(.98);\n      padding: clamp(18px, 2.2vw, 34px);\n      background: var(--paper);\n      color: var(--paper-ink);\n      border-radius: 2px;\n      box-shadow: 0 26px 80px rgba(0,0,0,.58), inset 0 0 0 1px rgba(80,45,18,.18);\n      font-family: \"KaiTi\", \"STKaiti\", \"Microsoft YaHei\", serif;\n      font-size: clamp(17px, 2vw, 34px);\n      line-height: 1.7;\n      opacity: 0;\n      pointer-events: none;\n      transition: opacity 520ms var(--ease), transform 520ms var(--ease);\n      transition-delay: 0ms;\n    }\n\n    .stage[data-step=\"2\"] .note {\n      opacity: 1;\n      transform: translate(-50%, -50%) scale(1) rotate(-1deg);\n      transition-delay: 620ms;\n    }\n\n    .overlay-line {\n      position: absolute;\n      z-index: 21;\n      left: 50%;\n      bottom: clamp(22px, 4vw, 64px);\n      width: min(86%, 1100px);\n      transform: translateX(-50%) translateY(16px);\n      padding: clamp(12px, 1.5vw, 22px) clamp(16px, 2vw, 30px);\n      color: #fff;\n      font-size: clamp(16px, 2.3vw, 38px);\n      line-height: 1.45;\n      text-align: center;\n      text-shadow: 0 4px 14px rgba(0,0,0,.95);\n      background:\n        linear-gradient(90deg, rgba(0,0,0,.08), rgba(0,0,0,.62), rgba(0,0,0,.08));\n      opacity: 0;\n      pointer-events: none;\n      transition: opacity 520ms var(--ease), transform 520ms var(--ease);\n      transition-delay: 0ms;\n    }\n\n    .stage[data-step=\"4\"] .os,\n    .stage[data-step=\"6\"] .ending {\n      opacity: 1;\n      transform: translateX(-50%) translateY(0);\n      transition-delay: 1250ms;\n    }\n\n    .hint {\n      position: absolute;\n      z-index: 30;\n      right: clamp(10px, 1.4vw, 22px);\n      top: clamp(10px, 1.4vw, 22px);\n      padding: 7px 11px;\n      border: 1px solid rgba(255,255,255,.18);\n      background: rgba(0,0,0,.52);\n      color: rgba(255,255,255,.72);\n      font-size: clamp(11px, .9vw, 14px);\n      line-height: 1;\n      opacity: .9;\n    }\n\n    .stage.is-final .panel,\n    .stage.is-final .note,\n    .stage.is-final .overlay-line,\n    .stage.is-final .hint {\n      opacity: 0;\n      pointer-events: none;\n    }\n\n    .final-screen {\n      position: absolute;\n      inset: 0;\n      z-index: 60;\n      display: grid;\n      place-items: center;\n      padding: clamp(22px, 5vw, 72px);\n      background: #000;\n      opacity: 0;\n      pointer-events: none;\n      transition: opacity 720ms var(--ease);\n    }\n\n    .stage.is-final .final-screen {\n      opacity: 1;\n      pointer-events: auto;\n    }\n\n    .typewriter {\n      width: min(86%, 980px);\n      min-height: 5.8em;\n      color: #f7f1e5;\n      font-family: \"KaiTi\", \"STKaiti\", \"Microsoft YaHei\", serif;\n      font-size: clamp(22px, 3.2vw, 46px);\n      line-height: 1.8;\n      text-align: center;\n      letter-spacing: 0;\n      text-shadow: 0 0 22px rgba(247, 241, 229, .24);\n      white-space: pre-wrap;\n    }\n\n    .typewriter::after {\n      content: \"\";\n      display: inline-block;\n      width: .08em;\n      height: 1.05em;\n      margin-left: .12em;\n      vertical-align: -.14em;\n      background: rgba(247, 241, 229, .9);\n      animation: caretBlink 840ms steps(1) infinite;\n    }\n\n    .typewriter.is-done::after {\n      opacity: 0;\n      animation: none;\n    }\n\n    @keyframes caretBlink {\n      50% { opacity: 0; }\n    }\n\n    @media (max-width: 720px) {\n      body { padding: 8px; }\n      .stage { width: calc(100vw - 16px); }\n      .caption { padding: 7px 9px; font-size: 10px; border-radius: 4px; }\n      .note { width: 76%; }\n      .overlay-line { bottom: 12px; width: 92%; }\n      .typewriter { width: 92%; min-height: 7.2em; font-size: 22px; }\n      .hint { display: none; }\n    }\n  \u003c/style\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n  \u003caudio id=\"bgm\" src=\"shawshank_bgm.mp3\" preload=\"auto\" loop\u003e\u003c/audio\u003e\n  \u003cmain class=\"stage\" id=\"stage\" data-step=\"1\" tabindex=\"0\" aria-label=\"点击推进瑞德与安迪的六幕分镜\"\u003e\n    \u003csection class=\"panel panel-1\" data-scene=\"1\"\u003e\n      \u003cdiv class=\"veil\"\u003e\u003cdiv class=\"lock\"\u003e1\u003c/div\u003e\u003c/div\u003e\n      \u003cdiv class=\"caption\"\u003e瑞德循着安迪留下的指引，找到了那颗橡树。\u003c/div\u003e\n    \u003c/section\u003e\n    \u003csection class=\"panel panel-2\" data-scene=\"2\"\u003e\n      \u003cdiv class=\"veil\"\u003e\u003cdiv class=\"lock\"\u003e2\u003c/div\u003e\u003c/div\u003e\n      \u003cdiv class=\"caption\"\u003e打开信纸。\u003c/div\u003e\n    \u003c/section\u003e\n    \u003csection class=\"panel panel-3\" data-scene=\"3\"\u003e\n      \u003cdiv class=\"veil\"\u003e\u003cdiv class=\"lock\"\u003e3\u003c/div\u003e\u003c/div\u003e\n      \u003cdiv class=\"caption\"\u003e瑞德乘坐巴士驶离边境小镇，前方是安迪说的“没有记忆的温暖的地方。”\u003c/div\u003e\n    \u003c/section\u003e\n    \u003csection class=\"panel panel-4\" data-scene=\"4\"\u003e\n      \u003cdiv class=\"veil\"\u003e\u003cdiv class=\"lock\"\u003e4\u003c/div\u003e\u003c/div\u003e\n      \u003cdiv class=\"caption\"\u003e瑞德望着倒退的树影——他终于违背了假释的承诺，跨越边境去赴约……\u003c/div\u003e\n    \u003c/section\u003e\n    \u003csection class=\"panel panel-5\" data-scene=\"5\"\u003e\n      \u003cdiv class=\"veil\"\u003e\u003cdiv class=\"lock\"\u003e5\u003c/div\u003e\u003c/div\u003e\n      \u003cdiv class=\"caption\"\u003e瑞德站在墨西哥的沙滩上，露出了前所未有的笑容——他终于只是瑞德，不再是肖申克的30265号。\u003c/div\u003e\n    \u003c/section\u003e\n    \u003csection class=\"panel panel-6\" data-scene=\"6\"\u003e\n      \u003cdiv class=\"veil\"\u003e\u003cdiv class=\"lock\"\u003e6\u003c/div\u003e\u003c/div\u003e\n      \u003cdiv class=\"caption\"\u003e在温暖的阳光下，在这片没有记忆的海滩，安迪等到了老友瑞德的到来……\u003c/div\u003e\n    \u003c/section\u003e\n\n    \u003cdiv class=\"note\" aria-hidden=\"true\"\u003e安迪：“我需要一个好人帮我实现计划，希望是件好东西，也许是世界上最好的东西，好东西永远不会消逝。”\u003c/div\u003e\n    \u003cdiv class=\"overlay-line os\"\u003e希望太平洋的海水和我梦中的一样蓝……\u003c/div\u003e\n    \u003cdiv class=\"overlay-line ending\"\u003e二人在海边相遇，携手开启了新的自由……\u003c/div\u003e\n    \u003cdiv class=\"hint\"\u003e点击 / 空格 推进\u003c/div\u003e\n    \u003cdiv class=\"final-screen\" aria-hidden=\"true\"\u003e\n      \u003cdiv class=\"typewriter\" id=\"typewriter\" data-text=\"你与瑞德在这片没有记忆的海滩享受着一切温馨美好，而你也将带着这份美好，去经营你自己的人生……\"\u003e\u003c/div\u003e\n    \u003c/div\u003e\n  \u003c/main\u003e\n\n  \u003cscript\u003e\n    const stage = document.getElementById(\u0027stage\u0027);\n    const bgm = document.getElementById(\u0027bgm\u0027);\n    const finalScreen = document.querySelector(\u0027.final-screen\u0027);\n    const typewriter = document.getElementById(\u0027typewriter\u0027);\n    const panels = Array.from(document.querySelectorAll(\u0027.panel\u0027));\n    const finalText = typewriter.dataset.text;\n    const maxStep = 7;\n    let step = 1;\n    let typingTimer = 0;\n    let hasStartedAudio = false;\n\n    function playBgm() {\n      if (hasStartedAudio) return;\n      hasStartedAudio = true;\n      bgm.volume = 0.72;\n      bgm.play().catch(() =\u003e {\n        hasStartedAudio = false;\n      });\n    }\n\n    function stopTypewriter() {\n      window.clearTimeout(typingTimer);\n      typewriter.textContent = \u0027\u0027;\n      typewriter.classList.remove(\u0027is-done\u0027);\n      finalScreen.setAttribute(\u0027aria-hidden\u0027, \u0027true\u0027);\n    }\n\n    function startTypewriter() {\n      window.clearTimeout(typingTimer);\n      typewriter.textContent = \u0027\u0027;\n      typewriter.classList.remove(\u0027is-done\u0027);\n      finalScreen.setAttribute(\u0027aria-hidden\u0027, \u0027false\u0027);\n\n      let index = 0;\n      function typeNext() {\n        typewriter.textContent = finalText.slice(0, index);\n        if (index \u003e= finalText.length) {\n          typewriter.classList.add(\u0027is-done\u0027);\n          return;\n        }\n        index += 1;\n        typingTimer = window.setTimeout(typeNext, finalText[index - 1] === \u0027，\u0027 ? 230 : 92);\n      }\n\n      typingTimer = window.setTimeout(typeNext, 620);\n    }\n\n    function render() {\n      stage.dataset.step = String(step);\n      stage.classList.toggle(\u0027is-final\u0027, step === maxStep);\n      document.body.classList.toggle(\u0027is-final-mode\u0027, step === maxStep);\n      panels.forEach((panel) =\u003e {\n        const scene = Number(panel.dataset.scene);\n        panel.classList.toggle(\u0027is-revealed\u0027, scene \u003c= step);\n        panel.classList.toggle(\u0027is-current\u0027, scene === step);\n        panel.classList.toggle(\u0027is-past\u0027, scene \u003c step);\n      });\n\n      if (step === maxStep) {\n        startTypewriter();\n      } else {\n        stopTypewriter();\n      }\n    }\n\n    function advance() {\n      playBgm();\n      if (step \u003e= maxStep) return;\n      step += 1;\n      render();\n    }\n\n    stage.addEventListener(\u0027click\u0027, advance);\n    stage.addEventListener(\u0027keydown\u0027, (event) =\u003e {\n      if (event.key === \u0027 \u0027 || event.key === \u0027Enter\u0027 || event.key === \u0027ArrowRight\u0027) {\n        event.preventDefault();\n        advance();\n      }\n      if (event.key === \u0027ArrowLeft\u0027) {\n        event.preventDefault();\n        playBgm();\n        step = step \u003c= 1 ? maxStep : step - 1;\n        render();\n      }\n    });\n\n    render();\n  \u003c/script\u003e\n\u003cscript\u003e\n(function () {\n  \"use strict\";\n\n  const routeMap = {\n    \"ending.html\": \"endingSelect\",\n    \"../三个结局/ending.html\": \"endingSelect\",\n    \"ending1/shawshank_storyboard_interactive.html\": \"ending1\",\n    \"../三个结局/ending1/shawshank_storyboard_interactive.html\": \"ending1\",\n    \"ending2/ending2_shawshank_storyboard_interactive.html\": \"ending2\",\n    \"../三个结局/ending2/ending2_shawshank_storyboard_interactive.html\": \"ending2\",\n    \"ending3/shawshank_no_reunion_interactive_bgm.html\": \"ending3\",\n    \"../三个结局/ending3/shawshank_no_reunion_interactive_bgm.html\": \"ending3\"\n  };\n\n  function openMergedPage(page) {\n    parent.postMessage({ type: \"shawshank-merged-nav\", page }, \"*\");\n  }\n\n  document.addEventListener(\"click\", function (event) {\n    const link = event.target \u0026\u0026 event.target.closest ? event.target.closest(\"a[href]\") : null;\n    if (!link) return;\n    const page = routeMap[link.getAttribute(\"href\")];\n    if (!page) return;\n    event.preventDefault();\n    openMergedPage(page);\n  }, true);\n}());\n\u003c/script\u003e\n\u003c/body\u003e\n\u003c/html\u003e\r\n\r\n\r\n",

    "ending2":  {
                    "html":  "\u003c!doctype html\u003e\n\u003chtml lang=\"zh-CN\"\u003e\n\u003chead\u003e\n  \u003cbase href=\"三个结局/ending2/\"\u003e\n  \u003cmeta charset=\"utf-8\"\u003e\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\"\u003e\n  \u003ctitle\u003e肖申克分镜互动\u003c/title\u003e\n  \u003cstyle\u003e\n    :root {\n      --paper: rgba(236, 210, 157, 0.92);\n      --ink: #23150d;\n      --amber: #d6a34f;\n      --shadow: rgba(0, 0, 0, 0.58);\n    }\n\n    * {\n      box-sizing: border-box;\n    }\n\n    html,\n    body {\n      width: 100%;\n      min-height: 100%;\n      margin: 0;\n      background:\n        radial-gradient(circle at 50% 20%, rgba(113, 75, 36, 0.38), transparent 34rem),\n        #100b08;\n      color: #f4e4c3;\n      font-family: \"Microsoft YaHei\", \"PingFang SC\", \"Noto Sans CJK SC\", Arial, sans-serif;\n    }\n\n    body {\n      min-height: 100vh;\n      display: grid;\n      place-items: center;\n      padding: clamp(10px, 2vw, 26px);\n      overflow-x: hidden;\n    }\n\n    body.is-final-mode {\n      padding: 0;\n      background: #000;\n    }\n\n    .wrap {\n      width: min(100%, 1672px);\n    }\n\n    body.is-final-mode .wrap {\n      width: 100%;\n    }\n\n    .stage {\n      position: relative;\n      width: 100%;\n      aspect-ratio: 1672 / 941;\n      overflow: hidden;\n      border: 2px solid rgba(244, 224, 183, 0.45);\n      background: #050302;\n      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.62);\n      cursor: pointer;\n      user-select: none;\n    }\n\n    .stage.is-final {\n      width: 100vw;\n      height: 100vh;\n      aspect-ratio: auto;\n      border: 0;\n      box-shadow: none;\n    }\n\n    .base,\n    .scene,\n    .mask {\n      position: absolute;\n      inset: 0;\n      background-image: url(\"shawshank_storyboard.jpg\");\n      background-size: 100% 100%;\n      background-position: center;\n    }\n\n    .base {\n      filter: sepia(0.25) brightness(0.42) contrast(1.05);\n      transform: scale(1.002);\n    }\n\n    .scene {\n      opacity: 0;\n      transform: scale(1.015);\n      transition: opacity 540ms ease, transform 700ms ease, filter 700ms ease;\n      filter: saturate(0.85) brightness(0.9);\n      pointer-events: none;\n    }\n\n    .mask {\n      background-image:\n        linear-gradient(rgba(12, 8, 5, 0.76), rgba(12, 8, 5, 0.76)),\n        url(\"shawshank_storyboard.jpg\");\n      background-blend-mode: multiply;\n      filter: blur(1.5px) sepia(0.4) brightness(0.36);\n      opacity: 1;\n      transition: opacity 500ms ease;\n      pointer-events: none;\n    }\n\n    .revealed {\n      opacity: 1;\n      transform: scale(1);\n      filter: saturate(1.03) brightness(1.03);\n    }\n\n    .hidden {\n      opacity: 0;\n    }\n\n    .s1 {\n      clip-path: polygon(0 0, 52% 0, 52% 13%, 47% 27%, 35% 29%, 25% 29%, 25% 31%, 0 35%);\n    }\n\n    .s2 {\n      clip-path: polygon(52% 0, 100% 0, 100% 24%, 73% 29%, 67% 27%, 61% 15%, 52% 13%);\n    }\n\n    .s3 {\n      clip-path: polygon(0 35%, 25% 29%, 30% 66%, 0 77%);\n    }\n\n    .s4 {\n      clip-path: polygon(25% 29%, 47% 27%, 61% 15%, 73% 29%, 67% 66%, 30% 66%);\n    }\n\n    .s5 {\n      clip-path: polygon(73% 29%, 100% 24%, 100% 66%, 67% 66%);\n    }\n\n    .s6 {\n      clip-path: polygon(0 77%, 30% 66%, 67% 66%, 100% 66%, 100% 100%, 0 100%);\n    }\n\n    .bubble {\n      position: absolute;\n      z-index: 5;\n      max-width: min(31%, 520px);\n      padding: clamp(8px, 1.05vw, 18px) clamp(10px, 1.35vw, 22px);\n      border: 1px solid rgba(255, 230, 180, 0.42);\n      border-radius: 8px;\n      background:\n        linear-gradient(135deg, rgba(52, 31, 17, 0.9), rgba(18, 13, 10, 0.84)),\n        var(--paper);\n      color: #fff0cf;\n      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.52), inset 0 0 22px rgba(216, 156, 72, 0.12);\n      font-size: clamp(12px, 1.26vw, 22px);\n      line-height: 1.45;\n      font-weight: 700;\n      text-shadow: 0 1px 1px rgba(0, 0, 0, 0.75);\n      opacity: 0;\n      transform: translateY(10px);\n      transition: opacity 500ms ease, transform 500ms ease;\n      pointer-events: none;\n    }\n\n    .bubble::before {\n      content: \"\";\n      position: absolute;\n      width: 16px;\n      height: 16px;\n      background: rgba(37, 24, 15, 0.9);\n      border-left: 1px solid rgba(255, 230, 180, 0.36);\n      border-bottom: 1px solid rgba(255, 230, 180, 0.36);\n      transform: rotate(-45deg);\n      bottom: -9px;\n      left: 28px;\n    }\n\n    .bubble.show {\n      opacity: 1;\n      transform: translateY(0);\n    }\n\n    .b1 {\n      left: 25.8%;\n      top: 6.8%;\n      max-width: 24%;\n    }\n\n    .b2 {\n      right: 5.2%;\n      top: 6.4%;\n      max-width: 29%;\n    }\n\n    .b3 {\n      left: 4.2%;\n      top: 41.5%;\n      max-width: 22%;\n    }\n\n    .b4 {\n      left: 36%;\n      top: 34.5%;\n      max-width: 29%;\n    }\n\n    .b5 {\n      right: 4.7%;\n      top: 37%;\n      max-width: 24%;\n    }\n\n    .b6 {\n      left: 32%;\n      bottom: 8.5%;\n      max-width: 36%;\n    }\n\n    .final-line {\n      position: absolute;\n      left: 50%;\n      bottom: 2.6%;\n      z-index: 8;\n      width: min(76%, 980px);\n      padding: clamp(8px, 1.1vw, 16px) clamp(14px, 2vw, 30px);\n      border-top: 1px solid rgba(255, 230, 180, 0.5);\n      border-bottom: 1px solid rgba(255, 230, 180, 0.5);\n      background: linear-gradient(90deg, transparent, rgba(13, 8, 5, 0.82), transparent);\n      color: #ffe8af;\n      font-size: clamp(16px, 2.45vw, 40px);\n      line-height: 1.25;\n      font-weight: 900;\n      letter-spacing: 0;\n      text-align: center;\n      text-shadow: 0 2px 7px #000, 0 0 16px rgba(218, 153, 63, 0.65);\n      opacity: 0;\n      transform: translate(-50%, 18px);\n      transition: opacity 700ms ease, transform 700ms ease;\n      pointer-events: none;\n    }\n\n    .final-line.show {\n      opacity: 1;\n      transform: translate(-50%, 0);\n    }\n\n    .stage.is-final .base,\n    .stage.is-final .scene,\n    .stage.is-final .mask,\n    .stage.is-final .bubble,\n    .stage.is-final .final-line {\n      opacity: 0;\n      pointer-events: none;\n    }\n\n    .epilogue-screen {\n      position: absolute;\n      inset: 0;\n      z-index: 40;\n      display: grid;\n      place-items: center;\n      padding: clamp(22px, 5vw, 72px);\n      background: #000;\n      opacity: 0;\n      pointer-events: none;\n      transition: opacity 720ms ease;\n    }\n\n    .epilogue-screen.show {\n      opacity: 1;\n      pointer-events: auto;\n    }\n\n    .typewriter-line {\n      width: min(86%, 980px);\n      min-height: 5.8em;\n      color: #f7f1e5;\n      font-family: \"KaiTi\", \"STKaiti\", \"Microsoft YaHei\", serif;\n      font-size: clamp(22px, 3.2vw, 46px);\n      line-height: 1.8;\n      text-align: center;\n      letter-spacing: 0;\n      text-shadow: 0 0 22px rgba(247, 241, 229, .24);\n      white-space: pre-wrap;\n    }\n\n    .typewriter-line::after {\n      content: \"\";\n      display: inline-block;\n      width: .08em;\n      height: 1.05em;\n      margin-left: .12em;\n      vertical-align: -.14em;\n      background: rgba(247, 241, 229, .9);\n      animation: caretBlink 840ms steps(1) infinite;\n    }\n\n    .typewriter-line.done::after {\n      opacity: 0;\n      animation: none;\n    }\n\n    @keyframes caretBlink {\n      50% { opacity: 0; }\n    }\n\n    .hint {\n      margin-top: 10px;\n      color: rgba(246, 224, 187, 0.7);\n      font-size: clamp(12px, 1.1vw, 15px);\n      text-align: center;\n    }\n\n    @media (max-width: 760px) {\n      body {\n        padding: 8px;\n      }\n\n      .bubble {\n        max-width: 38%;\n        padding: 6px 8px;\n        border-radius: 6px;\n        font-size: clamp(9px, 2vw, 13px);\n        line-height: 1.35;\n      }\n\n      .b1 {\n        left: 24%;\n        top: 5%;\n        max-width: 28%;\n      }\n\n      .b2 {\n        right: 3.5%;\n        top: 5%;\n        max-width: 34%;\n      }\n\n      .b3 {\n        left: 3%;\n        top: 39%;\n        max-width: 27%;\n      }\n\n      .b4 {\n        left: 33%;\n        top: 32%;\n        max-width: 33%;\n      }\n\n      .b5 {\n        right: 3%;\n        top: 35%;\n        max-width: 29%;\n      }\n\n      .b6 {\n        left: 30%;\n        bottom: 9%;\n        max-width: 42%;\n      }\n\n      .final-line {\n        width: 86%;\n        bottom: 1.8%;\n      }\n\n      .typewriter-line {\n        width: 92%;\n        min-height: 7.2em;\n        font-size: 22px;\n      }\n\n      .hint {\n        font-size: 12px;\n      }\n    }\n  \u003c/style\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n  \u003caudio id=\"bgm\" src=\"ending2_bgm.mp3\" loop preload=\"auto\"\u003e\u003c/audio\u003e\n  \u003cmain class=\"wrap\"\u003e\n    \u003csection class=\"stage\" id=\"stage\" role=\"button\" tabindex=\"0\" aria-label=\"点击逐幕揭开肖申克分镜\"\u003e\n      \u003cdiv class=\"base\" aria-hidden=\"true\"\u003e\u003c/div\u003e\n\n      \u003cdiv class=\"scene s1 revealed\" data-scene=\"1\" aria-hidden=\"true\"\u003e\u003c/div\u003e\n      \u003cdiv class=\"scene s2\" data-scene=\"2\" aria-hidden=\"true\"\u003e\u003c/div\u003e\n      \u003cdiv class=\"scene s3\" data-scene=\"3\" aria-hidden=\"true\"\u003e\u003c/div\u003e\n      \u003cdiv class=\"scene s4\" data-scene=\"4\" aria-hidden=\"true\"\u003e\u003c/div\u003e\n      \u003cdiv class=\"scene s5\" data-scene=\"5\" aria-hidden=\"true\"\u003e\u003c/div\u003e\n      \u003cdiv class=\"scene s6\" data-scene=\"6\" aria-hidden=\"true\"\u003e\u003c/div\u003e\n\n      \u003cdiv class=\"mask s2\" data-mask=\"2\" aria-hidden=\"true\"\u003e\u003c/div\u003e\n      \u003cdiv class=\"mask s3\" data-mask=\"3\" aria-hidden=\"true\"\u003e\u003c/div\u003e\n      \u003cdiv class=\"mask s4\" data-mask=\"4\" aria-hidden=\"true\"\u003e\u003c/div\u003e\n      \u003cdiv class=\"mask s5\" data-mask=\"5\" aria-hidden=\"true\"\u003e\u003c/div\u003e\n      \u003cdiv class=\"mask s6\" data-mask=\"6\" aria-hidden=\"true\"\u003e\u003c/div\u003e\n\n      \u003cdiv class=\"bubble b1 show\" data-bubble=\"1\"\u003e办公桌上，洗黑钱和受贿的账本摊开，典狱长的面具被彻底撕下！\u003c/div\u003e\n      \u003cdiv class=\"bubble b2\" data-bubble=\"2\"\u003e《肖申克纪事报》头条炸开，典狱长腐败行径被曝光，曾经的权力被彻底粉碎！\u003c/div\u003e\n      \u003cdiv class=\"bubble b3\" data-bubble=\"3\"\u003e门外传来脚步，墙上的十字绣赫然醒目——上帝的审判比预料的来的快……\u003c/div\u003e\n      \u003cdiv class=\"bubble b4\" data-bubble=\"4\"\u003e没有给典狱长饮弹自尽逃避审判的机会，法槌落下，冰冷的手铐锁住了他曾“拥有”的一切……\u003c/div\u003e\n      \u003cdiv class=\"bubble b5\" data-bubble=\"5\"\u003e在警卫的押送下，典狱长被送进监狱……\u003c/div\u003e\n      \u003cdiv class=\"bubble b6\" data-bubble=\"6\"\u003e由于头条影响，肖申克监狱被彻查，相关人员由于表现良好被释放，瑞德也在其中……\u003c/div\u003e\n      \u003cdiv class=\"final-line\" id=\"finalLine\"\u003e坏人得到了应有的惩罚，好人也没有蒙冤……\u003c/div\u003e\n      \u003cdiv class=\"epilogue-screen\" id=\"epilogueScreen\" aria-hidden=\"true\"\u003e\n        \u003cdiv class=\"typewriter-line\" id=\"typewriterLine\" aria-live=\"polite\"\u003e\u003c/div\u003e\n      \u003c/div\u003e\n    \u003c/section\u003e\n    \u003cdiv class=\"hint\" id=\"hint\"\u003e点击画面继续揭开下一幕\u003c/div\u003e\n  \u003c/main\u003e\n\n  \u003cscript\u003e\n    const stage = document.getElementById(\"stage\");\n    const hint = document.getElementById(\"hint\");\n    const finalLine = document.getElementById(\"finalLine\");\n    const epilogueScreen = document.getElementById(\"epilogueScreen\");\n    const typewriterLine = document.getElementById(\"typewriterLine\");\n    const bgm = document.getElementById(\"bgm\");\n    const epilogueText = \"经过你的举报，肖申克的黑暗终于被照亮，你以自己的方式帮助了瑞德等狱友，而这份勇气和正义，也将随你到现实中传递……\";\n    let currentScene = 1;\n    let musicStarted = false;\n    let finalLineShown = false;\n    let typewriterStarted = false;\n\n    function startMusic() {\n      if (musicStarted) return;\n      musicStarted = true;\n      bgm.volume = 0.74;\n      bgm.play().catch(() =\u003e {\n        musicStarted = false;\n      });\n    }\n\n    function startTypewriter() {\n      if (typewriterStarted) return;\n      typewriterStarted = true;\n      stage.classList.add(\"is-final\");\n      document.body.classList.add(\"is-final-mode\");\n      epilogueScreen.classList.add(\"show\");\n      epilogueScreen.setAttribute(\"aria-hidden\", \"false\");\n      hint.textContent = \"尾声\";\n\n      let index = 0;\n      function typeNext() {\n        typewriterLine.textContent = epilogueText.slice(0, index);\n        if (index \u003e= epilogueText.length) {\n          typewriterLine.classList.add(\"done\");\n          return;\n        }\n        index += 1;\n        window.setTimeout(typeNext, epilogueText[index - 1] === \"，\" ? 230 : 92);\n      }\n\n      window.setTimeout(typeNext, 620);\n    }\n\n    function revealNext() {\n      startMusic();\n      if (currentScene \u003e= 6) {\n        if (!finalLineShown) {\n          finalLineShown = true;\n          finalLine.classList.add(\"show\");\n          hint.textContent = \"点击进入尾声\";\n          return;\n        }\n        startTypewriter();\n        return;\n      }\n\n      currentScene += 1;\n      const scene = document.querySelector(`[data-scene=\"${currentScene}\"]`);\n      const mask = document.querySelector(`[data-mask=\"${currentScene}\"]`);\n      const bubble = document.querySelector(`[data-bubble=\"${currentScene}\"]`);\n\n      scene?.classList.add(\"revealed\");\n      mask?.classList.add(\"hidden\");\n      window.setTimeout(() =\u003e bubble?.classList.add(\"show\"), 620);\n\n      if (currentScene === 6) {\n        window.setTimeout(() =\u003e {\n          finalLine.classList.add(\"show\");\n          finalLineShown = true;\n          hint.textContent = \"点击进入尾声\";\n        }, 1250);\n      }\n    }\n\n    stage.addEventListener(\"click\", revealNext);\n    stage.addEventListener(\"keydown\", (event) =\u003e {\n      if (event.key === \"Enter\" || event.key === \" \") {\n        event.preventDefault();\n        revealNext();\n      }\n    });\n  \u003c/script\u003e\n\u003cscript\u003e\n(function () {\n  \"                     "html":  "\u003c!doctype html\u003e\n\u003chtml lang=\"zh-CN\"\u003e\n\u003chead\u003e\n  \u003cbase href=\"三个结局/ending3/\"\u003e\n  \u003cmeta charset=\"utf-8\"\u003e\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\"\u003e\n  \u003ctitle\u003e安迪与瑞德：另一种结局\u003c/title\u003e\n  \u003cstyle\u003e\n    :root {\n      --ink: #120c08;\n      --paper: rgba(241, 218, 176, 0.93);\n      --gold: #d8ac68;\n      --ease: cubic-bezier(.2,.8,.2,1);\n    }\n\n    * {\n      box-sizing: border-box;\n    }\n\n    html,\n    body {\n      width: 100%;\n      min-height: 100%;\n      margin: 0;\n      background:\n        radial-gradient(circle at 66% 20%, rgba(58, 126, 153, .25), transparent 32rem),\n        radial-gradient(circle at 24% 60%, rgba(110, 69, 36, .34), transparent 30rem),\n        #070605;\n      color: #f7e8ca;\n      font-family: \"Microsoft YaHei\", \"PingFang SC\", \"Noto Sans CJK SC\", Arial, sans-serif;\n    }\n\n    body {\n      min-height: 100vh;\n      display: grid;\n      place-items: center;\n      padding: clamp(10px, 2vw, 26px);\n      overflow-x: hidden;\n    }\n\n    .wrap {\n      width: min(100%, 1672px);\n    }\n\n    .stage {\n      position: relative;\n      width: 100%;\n      aspect-ratio: 1672 / 941;\n      overflow: hidden;\n      background: #050403;\n      box-shadow: 0 24px 78px rgba(0, 0, 0, .68);\n      cursor: pointer;\n      user-select: none;\n    }\n\n    .base,\n    .scene,\n    .mask {\n      position: absolute;\n      inset: 0;\n      background-image: url(\"shawshank_no_reunion_storyboard.jpg\");\n      background-size: 100% 100%;\n      background-position: center;\n    }\n\n    .base {\n      filter: sepia(.22) brightness(.4) contrast(1.05);\n      transform: scale(1.002);\n    }\n\n    .scene {\n      opacity: 0;\n      transform: scale(1.014);\n      filter: saturate(.86) brightness(.92);\n      transition: opacity 540ms var(--ease), transform 700ms var(--ease), filter 700ms var(--ease);\n      pointer-events: none;\n    }\n\n    .scene.revealed {\n      opacity: 1;\n      transform: scale(1);\n      filter: saturate(1.04) brightness(1.03);\n    }\n\n    .mask {\n      background-image:\n        linear-gradient(rgba(7, 5, 4, .77), rgba(7, 5, 4, .77)),\n        url(\"shawshank_no_reunion_storyboard.jpg\");\n      background-blend-mode: multiply;\n      filter: blur(1.4px) sepia(.38) brightness(.35);\n      opacity: 1;\n      transition: opacity 520ms var(--ease);\n      pointer-events: none;\n    }\n\n    .mask.hidden {\n      opacity: 0;\n    }\n\n    .s1 { clip-path: polygon(0 0, 34.5% 0, 34.4% 46.5%, 0 45.8%); }\n    .s2 { clip-path: polygon(34.5% 0, 66.4% 0, 66.2% 47.4%, 34.4% 46.5%); }\n    .s3 { clip-path: polygon(66.4% 0, 100% 0, 100% 47.8%, 66.2% 47.4%); }\n    .s4 { clip-path: polygon(0 45.8%, 34.4% 46.5%, 34.1% 100%, 0 100%); }\n    .s5 { clip-path: polygon(34.4% 46.5%, 66.2% 47.4%, 66.1% 100%, 34.1% 100%); }\n    .s6 { clip-path: polygon(66.2% 47.4%, 100% 47.8%, 100% 100%, 66.1% 100%); }\n\n    .bubble {\n      position: absolute;\n      z-index: 8;\n      max-width: min(28%, 470px);\n      padding: clamp(8px, 1vw, 16px) clamp(10px, 1.28vw, 20px);\n      border: 1px solid rgba(250, 224, 177, .42);\n      border-radius: 8px;\n      background:\n        linear-gradient(135deg, rgba(43, 28, 17, .9), rgba(12, 10, 8, .84)),\n        var(--paper);\n      color: #fff0d2;\n      box-shadow: 0 12px 32px rgba(0, 0, 0, .55), inset 0 0 20px rgba(218, 165, 88, .12);\n      font-size: clamp(12px, 1.13vw, 20px);\n      line-height: 1.48;\n      font-weight: 700;\n      letter-spacing: 0;\n      text-shadow: 0 1px 2px rgba(0, 0, 0, .8);\n      opacity: 0;\n      transform: translateY(10px);\n      transition: opacity 500ms var(--ease), transform 500ms var(--ease);\n      pointer-events: none;\n    }\n\n    .bubble::before {\n      content: \"\";\n      position: absolute;\n      left: 28px;\n      bottom: -8px;\n      width: 15px;\n      height: 15px;\n      background: rgba(35, 23, 15, .92);\n      border-left: 1px solid rgba(250, 224, 177, .36);\n      border-bottom: 1px solid rgba(250, 224, 177, .36);\n      transform: rotate(-45deg);\n    }\n\n    .bubble.show {\n      opacity: 1;\n      transform: translateY(0);\n    }\n\n    .b1 { left: 4.3%; top: 7.4%; max-width: 27%; }\n    .b2 { left: 38.2%; top: 6.7%; max-width: 25%; }\n    .b3 { right: 4.5%; top: 8.2%; max-width: 28%; }\n    .b4 { left: 4.2%; bottom: 8.5%; max-width: 27%; }\n    .b5 { left: 39.5%; bottom: 8.3%; max-width: 24%; }\n    .b6 { right: 4.3%; bottom: 8.8%; max-width: 28%; }\n\n    .final-line {\n      position: absolute;\n      left: 50%;\n      bottom: 2.3%;\n      z-index: 12;\n      width: min(82%, 1100px);\n      padding: clamp(8px, 1.1vw, 16px) clamp(14px, 2vw, 30px);\n      border-top: 1px solid rgba(252, 226, 178, .46);\n      border-bottom: 1px solid rgba(252, 226, 178, .46);\n      background: linear-gradient(90deg, transparent, rgba(9, 7, 6, .84), transparent);\n      color: #ffe9b8;\n      font-size: clamp(15px, 2.25vw, 38px);\n      line-height: 1.28;\n      font-weight: 900;\n      text-align: center;\n      text-shadow: 0 2px 8px #000, 0 0 18px rgba(215, 166, 92, .58);\n      opacity: 0;\n      transform: translate(-50%, 18px);\n      transition: opacity 700ms var(--ease), transform 700ms var(--ease);\n      pointer-events: none;\n    }\n\n    .final-line.show {\n      opacity: 1;\n      transform: translate(-50%, 0);\n    }\n\n    .typewriter-line {\n      position: absolute;\n      left: 50%;\n      top: 50%;\n      z-index: 13;\n      width: min(86%, 980px);\n      min-height: 5.8em;\n      color: #f7f1e5;\n      font-family: \"KaiTi\", \"STKaiti\", \"Microsoft YaHei\", serif;\n      font-size: clamp(22px, 3.2vw, 46px);\n      line-height: 1.8;\n      text-align: center;\n      letter-spacing: 0;\n      text-shadow: 0 0 22px rgba(247, 241, 229, .24);\n      white-space: pre-wrap;\n      opacity: 0;\n      transform: translate(-50%, calc(-50% + 14px));\n      transition: opacity 650ms var(--ease), transform 650ms var(--ease);\n      pointer-events: none;\n    }\n\n    .typewriter-line.show {\n      opacity: 1;\n      transform: translate(-50%, -50%);\n    }\n\n    .typewriter-line::after {\n      content: \"\";\n      display: inline-block;\n      width: .08em;\n      height: 1.05em;\n      margin-left: .12em;\n      vertical-align: -.14em;\n      background: rgba(247, 241, 229, .9);\n      animation: caretBlink 840ms steps(1) infinite;\n    }\n\n    .typewriter-line.done::after {\n      opacity: 0;\n      animation: none;\n    }\n\n    .epilogue-screen {\n      position: absolute;\n      inset: 0;\n      z-index: 40;\n      background: #000;\n      opacity: 0;\n      pointer-events: none;\n      transition: opacity 760ms var(--ease);\n    }\n\n    .epilogue-screen.show {\n      opacity: 1;\n      pointer-events: auto;\n    }\n\n    @keyframes caretBlink {\n      50% { opacity: 0; }\n    }\n\n    .hint {\n      margin-top: 10px;\n      color: rgba(246, 226, 194, .72);\n      font-size: clamp(12px, 1.1vw, 15px);\n      text-align: center;\n    }\n\n    @media (max-width: 760px) {\n      body { padding: 8px; }\n      .bubble {\n        padding: 6px 8px;\n        border-radius: 6px;\n        font-size: clamp(9px, 2vw, 13px);\n        line-height: 1.34;\n      }\n      .b1, .b2, .b3, .b4, .b5, .b6 { max-width: 30%; }\n      .b1 { left: 3%; top: 5.5%; }\n      .b2 { left: 37%; top: 5.5%; }\n      .b3 { right: 3%; top: 5.5%; }\n      .b4 { left: 3%; bottom: 7%; }\n      .b5 { left: 37%; bottom: 7%; }\n      .b6 { right: 3%; bottom: 7%; }\n      .final-line { width: 88%; bottom: 1.7%; }\n      .typewriter-line { width: 92%; min-height: 7.2em; font-size: 22px; }\n      .hint { font-size: 12px; }\n    }\n  \u003c/style\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n  \u003cmain class=\"wrap\"\u003e\n    \u003csection class=\"stage\" id=\"stage\" role=\"button\" tabindex=\"0\" aria-label=\"点击逐幕揭开安迪与瑞德的另一种结局\"\u003e\n      \u003cdiv class=\"base\" aria-hidden=\"true\"\u003e\u003c/div\u003e\n\n      \u003cdiv class=\"scene s1 revealed\" data-scene=\"1\" aria-hidden=\"true\"\u003e\u003c/div\u003e\n      \u003cdiv class=\"scene s2\" data-scene=\"2\" aria-hidden=\"true\"\u003e\u003c/div\u003e\n      \u003cdiv class=\"scene s3\" data-scene=\"3\" aria-hidden=\"true\"\u003e\u003c/div\u003e\n      \u003cdiv class=\"scene s4\" data-scene=\"4\" aria-hidden=\"true\"\u003e\u003c/div\u003e\n      \u003cdiv class=\"scene s5\" data-scene=\"5\" aria-hidden=\"true\"\u003e\u003c/div\u003e\n      \u003cdiv class=\"scene s6\" data-scene=\"6\" aria-hidden=\"true\"\u003e\u003c/div\u003e\n\n      \u003cdiv class=\"mask s2\" data-mask=\"2\" aria-hidden=\"true\"\u003e\u003c/div\u003e\n      \u003cdiv class=\"mask s3\" data-mask=\"3\" aria-hidden=\"true\"\u003e\u003c/div\u003e\n      \u003cdiv class=\"mask s4\" data-mask=\"4\" aria-hidden=\"true\"\u003e\u003c/div\u003e\n      \u003cdiv class=\"mask s5\" data-mask=\"5\" aria-hidden=\"true\"\u003e\u003c/div\u003e\n      \u003cdiv class=\"mask s6\" data-mask=\"6\" aria-hidden=\"true\"\u003e\u003c/div\u003e\n\n      \u003cdiv class=\"bubble b1 show\" data-bubble=\"1\"\u003e安迪化身为史蒂文斯的假身份，在缅因州的各个银行，将典狱长的不义之财尽数取走……\u003c/div\u003e\n      \u003cdiv class=\"bubble b2\" data-bubble=\"2\"\u003e摇下车窗，安迪吹着自由的风，沿着海岸线一路驶向墨西哥……\u003c/div\u003e\n      \u003cdiv class=\"bubble b3\" data-bubble=\"3\"\u003e在海滩边，安迪买下了一艘破旧的小船，专心地打磨船身，构建着自己梦想中的新生活。\u003c/div\u003e\n      \u003cdiv class=\"bubble b4\" data-bubble=\"4\"\u003e安迪逃走后，狱友们一直在讨论他的事迹……\u003c/div\u003e\n      \u003cdiv class=\"bubble b5\" data-bubble=\"5\"\u003e安迪的离开和老布的死亡使瑞德在监狱里显得更加苍老与孤独，他也不清楚自己出狱后该何去何从……\u003c/div\u003e\n      \u003cdiv class=\"bubble b6\" data-bubble=\"6\"\u003e假释后的瑞德，在超市里做着装袋工，过着体制外的“高墙化”生活……\u003c/div\u003e\n      \u003cdiv class=\"final-line\" id=\"finalLine\"\u003e安迪隐姓埋名，没有给瑞德留下任何线索，二人再无交集……\u003c/div\u003e\n      \u003cdiv class=\"epilogue-screen\" id=\"epilogueScreen\"\u0 ;\n          return;\n        }\n        startTypewriter();\n        return;\n      }\n\n      currentScene += 1;\n      const scene = document.querySelector(`[data-scene=\"${currentScene}\"]`);\n      const mask = document.querySelector(`[data-mask=\"${currentScene}\"]`);\n      const bubble = document.querySelector(`[data-bubble=\"${currentScene}\"]`);\n\n      scene?.classList.add(\"revealed\");\n      mask?.classList.add(\"hidden\");\n      window.setTimeout(() =\u003e bubble?.classList.add(\"show\"), 620);\n\n      if (currentScene === 6) {\n        window.setTimeout(() =\u003e {\n          finalLine.classList.add(\"show\");\n          finalLineShown = true;\n          hint.textContent = \"点击进入尾声\";\n        }, 1250);\n      }\n    }\n\n    stage.addEventListener(\"click\", revealNext);\n    stage.addEventListener(\"keydown\", (event) =\u003e {\n      if (event.key === \"Enter\" || event.key === \" \") {\n        event.preventDefault();\n        revealNext();\n      }\n    });\n  \u003c/script\u003e\n\u003cscript\u003e\n(function () {\n  \"use strict\";\n\n  const routeMap = {\n    \"ending.html\": \"endingSelect\",\n    \"../三个结局/ending.html\": \"endingSelect\",\n    \"ending1/shawshank_storyboard_interactive.html\": \"ending1\",\n    \"../三个结局/ending1/shawshank_storyboard_interactive.html\": \"ending1\",\n    \"ending2/ending2_shawshank_storyboard_interactive.html\": \"ending2\",\n    \"../三个结局/ending2/ending2_shawshank_storyboard_interactive.html\": \"ending2\",\n    \"ending3/shawshank_no_reunion_interactive_bgm.html\": \"ending3\",\n    \"../三个结局/ending3/shawshank_no_reunion_interactive_bgm.html\": \"ending3\"\n  };\n\n  function openMergedPage(page) {\n    parent.postMessage({ type: \"shawshank-merged-nav\", page }, \"*\");\n  }\n\n  document.addEventListener(\"click\", function (event) {\n    const link = event.target \u0026\u0026 event.target.closest ? event.target.closest(\"a[href]\") : null;\n    if (!link) return;\n    const page = routeMap[link.getAttribute(\"href\")];\n    if (!page) return;\n    event.preventDefault();\n    openMergedPage(page);\n  }, true);\n}());\n\u003c/script\u003e\n\u003c/body\u003e\n\u003c/html\u003e\n",

        cancelable: true
      });
      frameWindow.dispatchEvent(forwarded);
      if (forwarded.defaultPrevented) event.preventDefault();
    }

    window.addEventListener("message", (event) => {
      if (!event.data || event.data.type !== "shawshank-merged-nav") return;
      openPage(event.data.page);
    });

    window.addEventListener("pointerdown", focusFrame, true);
    window.addEventListener("keydown", forwardKeyEvent, true);
    window.addEventListener("keyup", forwardKeyEvent, true);

    openPage("game");
  </script>
</body>
</html>
