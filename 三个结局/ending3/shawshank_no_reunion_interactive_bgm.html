<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>安迪与瑞德：另一种结局</title>
  <style>
    :root {
      --ink: #120c08;
      --paper: rgba(241, 218, 176, 0.93);
      --gold: #d8ac68;
      --ease: cubic-bezier(.2,.8,.2,1);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background:
        radial-gradient(circle at 66% 20%, rgba(58, 126, 153, .25), transparent 32rem),
        radial-gradient(circle at 24% 60%, rgba(110, 69, 36, .34), transparent 30rem),
        #070605;
      color: #f7e8ca;
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: clamp(10px, 2vw, 26px);
      overflow-x: hidden;
    }

    .wrap {
      width: min(100%, 1672px);
    }

    .stage {
      position: relative;
      width: 100%;
      aspect-ratio: 1672 / 941;
      overflow: hidden;
      background: #050403;
      box-shadow: 0 24px 78px rgba(0, 0, 0, .68);
      cursor: pointer;
      user-select: none;
    }

    .base,
    .scene,
    .mask {
      position: absolute;
      inset: 0;
      background-image: url("shawshank_no_reunion_storyboard.jpg");
      background-size: 100% 100%;
      background-position: center;
    }

    .base {
      filter: sepia(.22) brightness(.4) contrast(1.05);
      transform: scale(1.002);
    }

    .scene {
      opacity: 0;
      transform: scale(1.014);
      filter: saturate(.86) brightness(.92);
      transition: opacity 540ms var(--ease), transform 700ms var(--ease), filter 700ms var(--ease);
      pointer-events: none;
    }

    .scene.revealed {
      opacity: 1;
      transform: scale(1);
      filter: saturate(1.04) brightness(1.03);
    }

    .mask {
      background-image:
        linear-gradient(rgba(7, 5, 4, .77), rgba(7, 5, 4, .77)),
        url("shawshank_no_reunion_storyboard.jpg");
      background-blend-mode: multiply;
      filter: blur(1.4px) sepia(.38) brightness(.35);
      opacity: 1;
      transition: opacity 520ms var(--ease);
      pointer-events: none;
    }

    .mask.hidden {
      opacity: 0;
    }

    .s1 { clip-path: polygon(0 0, 34.5% 0, 34.4% 46.5%, 0 45.8%); }
    .s2 { clip-path: polygon(34.5% 0, 66.4% 0, 66.2% 47.4%, 34.4% 46.5%); }
    .s3 { clip-path: polygon(66.4% 0, 100% 0, 100% 47.8%, 66.2% 47.4%); }
    .s4 { clip-path: polygon(0 45.8%, 34.4% 46.5%, 34.1% 100%, 0 100%); }
    .s5 { clip-path: polygon(34.4% 46.5%, 66.2% 47.4%, 66.1% 100%, 34.1% 100%); }
    .s6 { clip-path: polygon(66.2% 47.4%, 100% 47.8%, 100% 100%, 66.1% 100%); }

    .bubble {
      position: absolute;
      z-index: 8;
      max-width: min(28%, 470px);
      padding: clamp(8px, 1vw, 16px) clamp(10px, 1.28vw, 20px);
      border: 1px solid rgba(250, 224, 177, .42);
      border-radius: 8px;
      background:
        linear-gradient(135deg, rgba(43, 28, 17, .9), rgba(12, 10, 8, .84)),
        var(--paper);
      color: #fff0d2;
      box-shadow: 0 12px 32px rgba(0, 0, 0, .55), inset 0 0 20px rgba(218, 165, 88, .12);
      font-size: clamp(12px, 1.13vw, 20px);
      line-height: 1.48;
      font-weight: 700;
      letter-spacing: 0;
      text-shadow: 0 1px 2px rgba(0, 0, 0, .8);
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 500ms var(--ease), transform 500ms var(--ease);
      pointer-events: none;
    }

    .bubble::before {
      content: "";
      position: absolute;
      left: 28px;
      bottom: -8px;
      width: 15px;
      height: 15px;
      background: rgba(35, 23, 15, .92);
      border-left: 1px solid rgba(250, 224, 177, .36);
      border-bottom: 1px solid rgba(250, 224, 177, .36);
      transform: rotate(-45deg);
    }

    .bubble.show {
      opacity: 1;
      transform: translateY(0);
    }

    .b1 { left: 4.3%; top: 7.4%; max-width: 27%; }
    .b2 { left: 38.2%; top: 6.7%; max-width: 25%; }
    .b3 { right: 4.5%; top: 8.2%; max-width: 28%; }
    .b4 { left: 4.2%; bottom: 8.5%; max-width: 27%; }
    .b5 { left: 39.5%; bottom: 8.3%; max-width: 24%; }
    .b6 { right: 4.3%; bottom: 8.8%; max-width: 28%; }

    .final-line {
      position: absolute;
      left: 50%;
      bottom: 2.3%;
      z-index: 12;
      width: min(82%, 1100px);
      padding: clamp(8px, 1.1vw, 16px) clamp(14px, 2vw, 30px);
      border-top: 1px solid rgba(252, 226, 178, .46);
      border-bottom: 1px solid rgba(252, 226, 178, .46);
      background: linear-gradient(90deg, transparent, rgba(9, 7, 6, .84), transparent);
      color: #ffe9b8;
      font-size: clamp(15px, 2.25vw, 38px);
      line-height: 1.28;
      font-weight: 900;
      text-align: center;
      text-shadow: 0 2px 8px #000, 0 0 18px rgba(215, 166, 92, .58);
      opacity: 0;
      transform: translate(-50%, 18px);
      transition: opacity 700ms var(--ease), transform 700ms var(--ease);
      pointer-events: none;
    }

    .final-line.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .typewriter-line {
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 13;
      width: min(86%, 980px);
      min-height: 5.8em;
      color: #f7f1e5;
      font-family: "KaiTi", "STKaiti", "Microsoft YaHei", serif;
      font-size: clamp(22px, 3.2vw, 46px);
      line-height: 1.8;
      text-align: center;
      letter-spacing: 0;
      text-shadow: 0 0 22px rgba(247, 241, 229, .24);
      white-space: pre-wrap;
      opacity: 0;
      transform: translate(-50%, calc(-50% + 14px));
      transition: opacity 650ms var(--ease), transform 650ms var(--ease);
      pointer-events: none;
    }

    .typewriter-line.show {
      opacity: 1;
      transform: translate(-50%, -50%);
    }

    .typewriter-line::after {
      content: "";
      display: inline-block;
      width: .08em;
      height: 1.05em;
      margin-left: .12em;
      vertical-align: -.14em;
      background: rgba(247, 241, 229, .9);
      animation: caretBlink 840ms steps(1) infinite;
    }

    .typewriter-line.done::after {
      opacity: 0;
      animation: none;
    }

    .epilogue-screen {
      position: absolute;
      inset: 0;
      z-index: 40;
      background: #000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 760ms var(--ease);
    }

    .epilogue-screen.show {
      opacity: 1;
      pointer-events: auto;
    }

    @keyframes caretBlink {
      50% { opacity: 0; }
    }

    .hint {
      margin-top: 10px;
      color: rgba(246, 226, 194, .72);
      font-size: clamp(12px, 1.1vw, 15px);
      text-align: center;
    }

    @media (max-width: 760px) {
      body { padding: 8px; }
      .bubble {
        padding: 6px 8px;
        border-radius: 6px;
        font-size: clamp(9px, 2vw, 13px);
        line-height: 1.34;
      }
      .b1, .b2, .b3, .b4, .b5, .b6 { max-width: 30%; }
      .b1 { left: 3%; top: 5.5%; }
      .b2 { left: 37%; top: 5.5%; }
      .b3 { right: 3%; top: 5.5%; }
      .b4 { left: 3%; bottom: 7%; }
      .b5 { left: 37%; bottom: 7%; }
      .b6 { right: 3%; bottom: 7%; }
      .final-line { width: 88%; bottom: 1.7%; }
      .typewriter-line { width: 92%; min-height: 7.2em; font-size: 22px; }
      .hint { font-size: 12px; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="stage" id="stage" role="button" tabindex="0" aria-label="点击逐幕揭开安迪与瑞德的另一种结局">
      <div class="base" aria-hidden="true"></div>

      <div class="scene s1 revealed" data-scene="1" aria-hidden="true"></div>
      <div class="scene s2" data-scene="2" aria-hidden="true"></div>
      <div class="scene s3" data-scene="3" aria-hidden="true"></div>
      <div class="scene s4" data-scene="4" aria-hidden="true"></div>
      <div class="scene s5" data-scene="5" aria-hidden="true"></div>
      <div class="scene s6" data-scene="6" aria-hidden="true"></div>

      <div class="mask s2" data-mask="2" aria-hidden="true"></div>
      <div class="mask s3" data-mask="3" aria-hidden="true"></div>
      <div class="mask s4" data-mask="4" aria-hidden="true"></div>
      <div class="mask s5" data-mask="5" aria-hidden="true"></div>
      <div class="mask s6" data-mask="6" aria-hidden="true"></div>

      <div class="bubble b1 show" data-bubble="1">安迪化身为史蒂文斯的假身份，在缅因州的各个银行，将典狱长的不义之财尽数取走……</div>
      <div class="bubble b2" data-bubble="2">摇下车窗，安迪吹着自由的风，沿着海岸线一路驶向墨西哥……</div>
      <div class="bubble b3" data-bubble="3">在海滩边，安迪买下了一艘破旧的小船，专心地打磨船身，构建着自己梦想中的新生活。</div>
      <div class="bubble b4" data-bubble="4">安迪逃走后，狱友们一直在讨论他的事迹……</div>
      <div class="bubble b5" data-bubble="5">安迪的离开和老布的死亡使瑞德在监狱里显得更加苍老与孤独，他也不清楚自己出狱后该何去何从……</div>
      <div class="bubble b6" data-bubble="6">假释后的瑞德，在超市里做着装袋工，过着体制外的“高墙化”生活……</div>
      <div class="final-line" id="finalLine">安迪隐姓埋名，没有给瑞德留下任何线索，二人再无交集……</div>
      <div class="epilogue-screen" id="epilogueScreen">
        <div class="typewriter-line" id="typewriterLine" aria-live="polite"></div>
      </div>
    </section>
    <div class="hint" id="hint">点击画面继续揭开下一幕</div>
  </main>

  <audio id="bgm" src="shawshank_no_reunion_bgm.mp4" loop preload="auto"></audio>

  <script>
    const stage = document.getElementById("stage");
    const hint = document.getElementById("hint");
    const finalLine = document.getElementById("finalLine");
    const epilogueScreen = document.getElementById("epilogueScreen");
    const typewriterLine = document.getElementById("typewriterLine");
    const bgm = document.getElementById("bgm");
    const epilogueText = "从此你再没见过瑞德，仿佛曾经发生在肖申克监狱的一切也都是一场梦，而你也将回归现实……";
    let currentScene = 1;
    let musicStarted = false;
    let finalLineShown = false;
    let typewriterStarted = false;

    function startMusic() {
      if (musicStarted) return;
      musicStarted = true;
      bgm.volume = 0.74;
      bgm.play().catch(() => {
        musicStarted = false;
      });
    }

    function startTypewriter() {
      if (typewriterStarted) return;
      typewriterStarted = true;
      epilogueScreen.classList.add("show");
      hint.textContent = "尾声";
      typewriterLine.classList.add("show");
      let index = 0;

      function typeNext() {
        typewriterLine.textContent = epilogueText.slice(0, index);
        if (index < epilogueText.length) {
          index += 1;
          window.setTimeout(typeNext, 82);
        } else {
          typewriterLine.classList.add("done");
        }
      }

      typeNext();
    }

    function revealNext() {
      startMusic();

      if (currentScene >= 6) {
        if (!finalLineShown) {
          finalLineShown = true;
          finalLine.classList.add("show");
          hint.textContent = "点击进入尾声";
          return;
        }
        startTypewriter();
        return;
      }

      currentScene += 1;
      const scene = document.querySelector(`[data-scene="${currentScene}"]`);
      const mask = document.querySelector(`[data-mask="${currentScene}"]`);
      const bubble = document.querySelector(`[data-bubble="${currentScene}"]`);

      scene?.classList.add("revealed");
      mask?.classList.add("hidden");
      window.setTimeout(() => bubble?.classList.add("show"), 620);

      if (currentScene === 6) {
        window.setTimeout(() => {
          finalLine.classList.add("show");
          finalLineShown = true;
          hint.textContent = "点击进入尾声";
        }, 1250);
      }
    }

    stage.addEventListener("click", revealNext);
    stage.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        revealNext();
      }
    });
  </script>
</body>
</html>
