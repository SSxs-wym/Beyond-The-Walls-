<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>肖申克分镜互动</title>
  <style>
    :root {
      --paper: rgba(236, 210, 157, 0.92);
      --ink: #23150d;
      --amber: #d6a34f;
      --shadow: rgba(0, 0, 0, 0.58);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background:
        radial-gradient(circle at 50% 20%, rgba(113, 75, 36, 0.38), transparent 34rem),
        #100b08;
      color: #f4e4c3;
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: clamp(10px, 2vw, 26px);
      overflow-x: hidden;
    }

    body.is-final-mode {
      padding: 0;
      background: #000;
    }

    .wrap {
      width: min(100%, 1672px);
    }

    body.is-final-mode .wrap {
      width: 100%;
    }

    .stage {
      position: relative;
      width: 100%;
      aspect-ratio: 1672 / 941;
      overflow: hidden;
      border: 2px solid rgba(244, 224, 183, 0.45);
      background: #050302;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.62);
      cursor: pointer;
      user-select: none;
    }

    .stage.is-final {
      width: 100vw;
      height: 100vh;
      aspect-ratio: auto;
      border: 0;
      box-shadow: none;
    }

    .base,
    .scene,
    .mask {
      position: absolute;
      inset: 0;
      background-image: url("shawshank_storyboard.jpg");
      background-size: 100% 100%;
      background-position: center;
    }

    .base {
      filter: sepia(0.25) brightness(0.42) contrast(1.05);
      transform: scale(1.002);
    }

    .scene {
      opacity: 0;
      transform: scale(1.015);
      transition: opacity 540ms ease, transform 700ms ease, filter 700ms ease;
      filter: saturate(0.85) brightness(0.9);
      pointer-events: none;
    }

    .mask {
      background-image:
        linear-gradient(rgba(12, 8, 5, 0.76), rgba(12, 8, 5, 0.76)),
        url("shawshank_storyboard.jpg");
      background-blend-mode: multiply;
      filter: blur(1.5px) sepia(0.4) brightness(0.36);
      opacity: 1;
      transition: opacity 500ms ease;
      pointer-events: none;
    }

    .revealed {
      opacity: 1;
      transform: scale(1);
      filter: saturate(1.03) brightness(1.03);
    }

    .hidden {
      opacity: 0;
    }

    .s1 {
      clip-path: polygon(0 0, 52% 0, 52% 13%, 47% 27%, 35% 29%, 25% 29%, 25% 31%, 0 35%);
    }

    .s2 {
      clip-path: polygon(52% 0, 100% 0, 100% 24%, 73% 29%, 67% 27%, 61% 15%, 52% 13%);
    }

    .s3 {
      clip-path: polygon(0 35%, 25% 29%, 30% 66%, 0 77%);
    }

    .s4 {
      clip-path: polygon(25% 29%, 47% 27%, 61% 15%, 73% 29%, 67% 66%, 30% 66%);
    }

    .s5 {
      clip-path: polygon(73% 29%, 100% 24%, 100% 66%, 67% 66%);
    }

    .s6 {
      clip-path: polygon(0 77%, 30% 66%, 67% 66%, 100% 66%, 100% 100%, 0 100%);
    }

    .bubble {
      position: absolute;
      z-index: 5;
      max-width: min(31%, 520px);
      padding: clamp(8px, 1.05vw, 18px) clamp(10px, 1.35vw, 22px);
      border: 1px solid rgba(255, 230, 180, 0.42);
      border-radius: 8px;
      background:
        linear-gradient(135deg, rgba(52, 31, 17, 0.9), rgba(18, 13, 10, 0.84)),
        var(--paper);
      color: #fff0cf;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.52), inset 0 0 22px rgba(216, 156, 72, 0.12);
      font-size: clamp(12px, 1.26vw, 22px);
      line-height: 1.45;
      font-weight: 700;
      text-shadow: 0 1px 1px rgba(0, 0, 0, 0.75);
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 500ms ease, transform 500ms ease;
      pointer-events: none;
    }

    .bubble::before {
      content: "";
      position: absolute;
      width: 16px;
      height: 16px;
      background: rgba(37, 24, 15, 0.9);
      border-left: 1px solid rgba(255, 230, 180, 0.36);
      border-bottom: 1px solid rgba(255, 230, 180, 0.36);
      transform: rotate(-45deg);
      bottom: -9px;
      left: 28px;
    }

    .bubble.show {
      opacity: 1;
      transform: translateY(0);
    }

    .b1 {
      left: 25.8%;
      top: 6.8%;
      max-width: 24%;
    }

    .b2 {
      right: 5.2%;
      top: 6.4%;
      max-width: 29%;
    }

    .b3 {
      left: 4.2%;
      top: 41.5%;
      max-width: 22%;
    }

    .b4 {
      left: 36%;
      top: 34.5%;
      max-width: 29%;
    }

    .b5 {
      right: 4.7%;
      top: 37%;
      max-width: 24%;
    }

    .b6 {
      left: 32%;
      bottom: 8.5%;
      max-width: 36%;
    }

    .final-line {
      position: absolute;
      left: 50%;
      bottom: 2.6%;
      z-index: 8;
      width: min(76%, 980px);
      padding: clamp(8px, 1.1vw, 16px) clamp(14px, 2vw, 30px);
      border-top: 1px solid rgba(255, 230, 180, 0.5);
      border-bottom: 1px solid rgba(255, 230, 180, 0.5);
      background: linear-gradient(90deg, transparent, rgba(13, 8, 5, 0.82), transparent);
      color: #ffe8af;
      font-size: clamp(16px, 2.45vw, 40px);
      line-height: 1.25;
      font-weight: 900;
      letter-spacing: 0;
      text-align: center;
      text-shadow: 0 2px 7px #000, 0 0 16px rgba(218, 153, 63, 0.65);
      opacity: 0;
      transform: translate(-50%, 18px);
      transition: opacity 700ms ease, transform 700ms ease;
      pointer-events: none;
    }

    .final-line.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .stage.is-final .base,
    .stage.is-final .scene,
    .stage.is-final .mask,
    .stage.is-final .bubble,
    .stage.is-final .final-line {
      opacity: 0;
      pointer-events: none;
    }

    .epilogue-screen {
      position: absolute;
      inset: 0;
      z-index: 40;
      display: grid;
      place-items: center;
      padding: clamp(22px, 5vw, 72px);
      background: #000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 720ms ease;
    }

    .epilogue-screen.show {
      opacity: 1;
      pointer-events: auto;
    }

    .typewriter-line {
      width: min(86%, 980px);
      min-height: 5.8em;
      color: #f7f1e5;
      font-family: "KaiTi", "STKaiti", "Microsoft YaHei", serif;
      font-size: clamp(22px, 3.2vw, 46px);
      line-height: 1.8;
      text-align: center;
      letter-spacing: 0;
      text-shadow: 0 0 22px rgba(247, 241, 229, .24);
      white-space: pre-wrap;
    }

    .typewriter-line::after {
      content: "";
      display: inline-block;
      width: .08em;
      height: 1.05em;
      margin-left: .12em;
      vertical-align: -.14em;
      background: rgba(247, 241, 229, .9);
      animation: caretBlink 840ms steps(1) infinite;
    }

    .typewriter-line.done::after {
      opacity: 0;
      animation: none;
    }

    @keyframes caretBlink {
      50% { opacity: 0; }
    }

    .hint {
      margin-top: 10px;
      color: rgba(246, 224, 187, 0.7);
      font-size: clamp(12px, 1.1vw, 15px);
      text-align: center;
    }

    @media (max-width: 760px) {
      body {
        padding: 8px;
      }

      .bubble {
        max-width: 38%;
        padding: 6px 8px;
        border-radius: 6px;
        font-size: clamp(9px, 2vw, 13px);
        line-height: 1.35;
      }

      .b1 {
        left: 24%;
        top: 5%;
        max-width: 28%;
      }

      .b2 {
        right: 3.5%;
        top: 5%;
        max-width: 34%;
      }

      .b3 {
        left: 3%;
        top: 39%;
        max-width: 27%;
      }

      .b4 {
        left: 33%;
        top: 32%;
        max-width: 33%;
      }

      .b5 {
        right: 3%;
        top: 35%;
        max-width: 29%;
      }

      .b6 {
        left: 30%;
        bottom: 9%;
        max-width: 42%;
      }

      .final-line {
        width: 86%;
        bottom: 1.8%;
      }

      .typewriter-line {
        width: 92%;
        min-height: 7.2em;
        font-size: 22px;
      }

      .hint {
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <audio id="bgm" src="ending2_bgm.mp3" loop preload="auto"></audio>
  <main class="wrap">
    <section class="stage" id="stage" role="button" tabindex="0" aria-label="点击逐幕揭开肖申克分镜">
      <div class="base" aria-hidden="true"></div>

      <div class="scene s1 revealed" data-scene="1" aria-hidden="true"></div>
      <div class="scene s2" data-scene="2" aria-hidden="true"></div>
      <div class="scene s3" data-scene="3" aria-hidden="true"></div>
      <div class="scene s4" data-scene="4" aria-hidden="true"></div>
      <div class="scene s5" data-scene="5" aria-hidden="true"></div>
      <div class="scene s6" data-scene="6" aria-hidden="true"></div>

      <div class="mask s2" data-mask="2" aria-hidden="true"></div>
      <div class="mask s3" data-mask="3" aria-hidden="true"></div>
      <div class="mask s4" data-mask="4" aria-hidden="true"></div>
      <div class="mask s5" data-mask="5" aria-hidden="true"></div>
      <div class="mask s6" data-mask="6" aria-hidden="true"></div>

      <div class="bubble b1 show" data-bubble="1">办公桌上，洗黑钱和受贿的账本摊开，典狱长的面具被彻底撕下！</div>
      <div class="bubble b2" data-bubble="2">《肖申克纪事报》头条炸开，典狱长腐败行径被曝光，曾经的权力被彻底粉碎！</div>
      <div class="bubble b3" data-bubble="3">门外传来脚步，墙上的十字绣赫然醒目——上帝的审判比预料的来的快……</div>
      <div class="bubble b4" data-bubble="4">没有给典狱长饮弹自尽逃避审判的机会，法槌落下，冰冷的手铐锁住了他曾“拥有”的一切……</div>
      <div class="bubble b5" data-bubble="5">在警卫的押送下，典狱长被送进监狱……</div>
      <div class="bubble b6" data-bubble="6">由于头条影响，肖申克监狱被彻查，相关人员由于表现良好被释放，瑞德也在其中……</div>
      <div class="final-line" id="finalLine">坏人得到了应有的惩罚，好人也没有蒙冤……</div>
      <div class="epilogue-screen" id="epilogueScreen" aria-hidden="true">
        <div class="typewriter-line" id="typewriterLine" aria-live="polite"></div>
      </div>
    </section>
    <div class="hint" id="hint">点击画面继续揭开下一幕</div>
  </main>

  <script>
    const stage = document.getElementById("stage");
    const hint = document.getElementById("hint");
    const finalLine = document.getElementById("finalLine");
    const epilogueScreen = document.getElementById("epilogueScreen");
    const typewriterLine = document.getElementById("typewriterLine");
    const bgm = document.getElementById("bgm");
    const epilogueText = "经过你的举报，肖申克的黑暗终于被照亮，你以自己的方式帮助了瑞德等狱友，而这份勇气和正义，也将随你到现实中传递……";
    let currentScene = 1;
    let musicStarted = false;
    let finalLineShown = false;
    let typewriterStarted = false;

    function startMusic() {
      if (musicStarted) return;
      musicStarted = true;
      bgm.volume = 0.74;
      bgm.play().catch(() => {
        musicStarted = false;
      });
    }

    function startTypewriter() {
      if (typewriterStarted) return;
      typewriterStarted = true;
      stage.classList.add("is-final");
      document.body.classList.add("is-final-mode");
      epilogueScreen.classList.add("show");
      epilogueScreen.setAttribute("aria-hidden", "false");
      hint.textContent = "尾声";

      let index = 0;
      function typeNext() {
        typewriterLine.textContent = epilogueText.slice(0, index);
        if (index >= epilogueText.length) {
          typewriterLine.classList.add("done");
          return;
        }
        index += 1;
        window.setTimeout(typeNext, epilogueText[index - 1] === "，" ? 230 : 92);
      }

      window.setTimeout(typeNext, 620);
    }

    function revealNext() {
      startMusic();
      if (currentScene >= 6) {
        if (!finalLineShown) {
          finalLineShown = true;
          finalLine.classList.add("show");
          hint.textContent = "点击进入尾声";
          return;
        }
        startTypewriter();
        return;
      }

      currentScene += 1;
      const scene = document.querySelector(`[data-scene="${currentScene}"]`);
      const mask = document.querySelector(`[data-mask="${currentScene}"]`);
      const bubble = document.querySelector(`[data-bubble="${currentScene}"]`);

      scene?.classList.add("revealed");
      mask?.classList.add("hidden");
      window.setTimeout(() => bubble?.classList.add("show"), 620);

      if (currentScene === 6) {
        window.setTimeout(() => {
          finalLine.classList.add("show");
          finalLineShown = true;
          hint.textContent = "点击进入尾声";
        }, 1250);
      }
    }

    stage.addEventListener("click", revealNext);
    stage.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        revealNext();
      }
    });
  </script>
</body>
</html>
