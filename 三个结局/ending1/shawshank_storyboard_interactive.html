<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>瑞德与安迪：自由分镜</title>
  <style>
    :root {
      color-scheme: dark;
      --paper: #f5ead4;
      --paper-ink: #402d1d;
      --veil: #000;
      --gold: #d9ad6a;
      --blue: #7fc7ff;
      --white: #f3ead8;
      --caption-bg: rgba(33, 24, 16, .64);
      --caption-border: rgba(215, 174, 113, .34);
      --ease: cubic-bezier(.2,.8,.2,1);
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      min-height: 100%;
      height: 100%;
      background: #030303;
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", Arial, sans-serif;
      color: var(--white);
      overflow-x: hidden;
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: clamp(12px, 2vw, 28px);
    }

    body.is-final-mode {
      padding: 0;
    }

    .stage {
      width: min(100vw - 24px, 1672px);
      aspect-ratio: 1672 / 941;
      position: relative;
      background: #000;
      cursor: pointer;
      user-select: none;
      overflow: hidden;
      box-shadow: 0 18px 60px rgba(0, 0, 0, .62);
    }

    .stage.is-final {
      width: 100vw;
      height: 100vh;
      aspect-ratio: auto;
      box-shadow: none;
    }

    .stage:focus-visible {
      outline: 1px solid rgba(217, 173, 106, .42);
      outline-offset: 4px;
    }

    .panel {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: transparent;
      transition: opacity 620ms var(--ease);
    }

    .panel::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: url("shawshank_storyboard.jpg");
      background-size: 100% 100%;
      background-repeat: no-repeat;
    }

    .panel-1 { clip-path: polygon(0 0, 39.1% 0, 38.5% 6.8%, 37.6% 18.5%, 36.5% 31.6%, 33.4% 47.1%, 0 52.1%); }
    .panel-2 { clip-path: polygon(0 50.2%, 33.4% 47.1%, 36.2% 61.4%, 37.9% 76.5%, 38.8% 90.8%, 39.1% 100%, 0 100%); }
    .panel-3 { clip-path: polygon(39.1% 0, 70.6% 0, 69.7% 11.2%, 69.1% 25.4%, 68.1% 40.3%, 67% 49.5%, 35.2% 47.2%, 36.6% 37.8%, 38.2% 25%, 39.1% 12.2%); }
    .panel-4 { clip-path: polygon(35.2% 47.2%, 67% 49.5%, 66.1% 60.3%, 65% 74.6%, 64% 89.6%, 63.2% 100%, 39.1% 100%, 38.3% 88.9%, 37% 74.2%, 35.5% 60.3%); }
    .panel-5 { clip-path: polygon(70.6% 0, 100% 0, 100% 47.7%, 67% 51%, 68.1% 39.7%, 69.1% 25.1%, 69.7% 11.2%); }
    .panel-6 { clip-path: polygon(67% 51%, 100% 47.7%, 100% 100%, 63.2% 100%, 64% 89.3%, 65% 74.5%, 66.1% 60.2%); }

    .veil {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: var(--veil);
      opacity: 1;
      transition: opacity 520ms var(--ease), transform 520ms var(--ease);
      z-index: 5;
    }

    .panel.is-revealed .veil {
      opacity: 0;
      transform: scale(1.04);
      pointer-events: none;
    }

    .lock {
      display: none;
    }

    .caption {
      position: absolute;
      z-index: 7;
      max-width: min(29vw, 440px);
      padding: clamp(10px, .95vw, 15px) clamp(13px, 1.2vw, 20px);
      border: 1px solid var(--caption-border);
      border-top-color: rgba(234, 199, 143, .44);
      border-radius: 4px;
      background:
        linear-gradient(180deg, rgba(221, 178, 112, .12), rgba(58, 37, 20, .08)),
        var(--caption-bg);
      backdrop-filter: blur(4px) saturate(.95);
      -webkit-backdrop-filter: blur(4px) saturate(.95);
      color: var(--white);
      font-size: clamp(12px, 1vw, 18px);
      line-height: 1.62;
      letter-spacing: 0;
      text-shadow: 0 2px 6px rgba(0,0,0,.78);
      box-shadow: 0 10px 24px rgba(0,0,0,.28), inset 0 1px 0 rgba(255, 238, 204, .09);
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 420ms var(--ease), transform 420ms var(--ease);
      transition-delay: 0ms;
      pointer-events: none;
    }

    .panel-1 .caption { left: 5%; top: 31%; max-width: 28%; }
    .panel-2 .caption { left: 6.2%; bottom: 7.8%; max-width: 24%; }
    .panel-3 .caption { left: 43%; top: 11.5%; max-width: 20%; }
    .panel-4 .caption { left: 42.2%; top: 53%; max-width: 20%; }
    .panel-5 .caption { right: 5.4%; top: 9%; max-width: 23%; }
    .panel-6 .caption { right: 6.2%; bottom: 8.8%; max-width: 22%; }

    .panel.is-current .caption {
      opacity: 1;
      transform: translateY(0);
      transition-delay: 620ms;
    }

    .panel.is-past .caption {
      opacity: 1;
      transform: translateY(0);
    }

    .note {
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 20;
      width: min(58%, 760px);
      transform: translate(-50%, -50%) scale(.98);
      padding: clamp(18px, 2.2vw, 34px);
      background: var(--paper);
      color: var(--paper-ink);
      border-radius: 2px;
      box-shadow: 0 26px 80px rgba(0,0,0,.58), inset 0 0 0 1px rgba(80,45,18,.18);
      font-family: "KaiTi", "STKaiti", "Microsoft YaHei", serif;
      font-size: clamp(17px, 2vw, 34px);
      line-height: 1.7;
      opacity: 0;
      pointer-events: none;
      transition: opacity 520ms var(--ease), transform 520ms var(--ease);
      transition-delay: 0ms;
    }

    .stage[data-step="2"] .note {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1) rotate(-1deg);
      transition-delay: 620ms;
    }

    .overlay-line {
      position: absolute;
      z-index: 21;
      left: 50%;
      bottom: clamp(22px, 4vw, 64px);
      width: min(86%, 1100px);
      transform: translateX(-50%) translateY(16px);
      padding: clamp(12px, 1.5vw, 22px) clamp(16px, 2vw, 30px);
      color: #fff;
      font-size: clamp(16px, 2.3vw, 38px);
      line-height: 1.45;
      text-align: center;
      text-shadow: 0 4px 14px rgba(0,0,0,.95);
      background:
        linear-gradient(90deg, rgba(0,0,0,.08), rgba(0,0,0,.62), rgba(0,0,0,.08));
      opacity: 0;
      pointer-events: none;
      transition: opacity 520ms var(--ease), transform 520ms var(--ease);
      transition-delay: 0ms;
    }

    .stage[data-step="4"] .os,
    .stage[data-step="6"] .ending {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
      transition-delay: 1250ms;
    }

    .hint {
      position: absolute;
      z-index: 30;
      right: clamp(10px, 1.4vw, 22px);
      top: clamp(10px, 1.4vw, 22px);
      padding: 7px 11px;
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(0,0,0,.52);
      color: rgba(255,255,255,.72);
      font-size: clamp(11px, .9vw, 14px);
      line-height: 1;
      opacity: .9;
    }

    .stage.is-final .panel,
    .stage.is-final .note,
    .stage.is-final .overlay-line,
    .stage.is-final .hint {
      opacity: 0;
      pointer-events: none;
    }

    .final-screen {
      position: absolute;
      inset: 0;
      z-index: 60;
      display: grid;
      place-items: center;
      padding: clamp(22px, 5vw, 72px);
      background: #000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 720ms var(--ease);
    }

    .stage.is-final .final-screen {
      opacity: 1;
      pointer-events: auto;
    }

    .typewriter {
      width: min(86%, 980px);
      min-height: 5.8em;
      color: #f7f1e5;
      font-family: "KaiTi", "STKaiti", "Microsoft YaHei", serif;
      font-size: clamp(22px, 3.2vw, 46px);
      line-height: 1.8;
      text-align: center;
      letter-spacing: 0;
      text-shadow: 0 0 22px rgba(247, 241, 229, .24);
      white-space: pre-wrap;
    }

    .typewriter::after {
      content: "";
      display: inline-block;
      width: .08em;
      height: 1.05em;
      margin-left: .12em;
      vertical-align: -.14em;
      background: rgba(247, 241, 229, .9);
      animation: caretBlink 840ms steps(1) infinite;
    }

    .typewriter.is-done::after {
      opacity: 0;
      animation: none;
    }

    @keyframes caretBlink {
      50% { opacity: 0; }
    }

    @media (max-width: 720px) {
      body { padding: 8px; }
      .stage { width: calc(100vw - 16px); }
      .caption { padding: 7px 9px; font-size: 10px; border-radius: 4px; }
      .note { width: 76%; }
      .overlay-line { bottom: 12px; width: 92%; }
      .typewriter { width: 92%; min-height: 7.2em; font-size: 22px; }
      .hint { display: none; }
    }
  </style>
</head>
<body>
  <audio id="bgm" src="shawshank_bgm.mp3" preload="auto" loop></audio>
  <main class="stage" id="stage" data-step="1" tabindex="0" aria-label="点击推进瑞德与安迪的六幕分镜">
    <section class="panel panel-1" data-scene="1">
      <div class="veil"><div class="lock">1</div></div>
      <div class="caption">瑞德循着安迪留下的指引，找到了那颗橡树。</div>
    </section>
    <section class="panel panel-2" data-scene="2">
      <div class="veil"><div class="lock">2</div></div>
      <div class="caption">打开信纸。</div>
    </section>
    <section class="panel panel-3" data-scene="3">
      <div class="veil"><div class="lock">3</div></div>
      <div class="caption">瑞德乘坐巴士驶离边境小镇，前方是安迪说的“没有记忆的温暖的地方。”</div>
    </section>
    <section class="panel panel-4" data-scene="4">
      <div class="veil"><div class="lock">4</div></div>
      <div class="caption">瑞德望着倒退的树影——他终于违背了假释的承诺，跨越边境去赴约……</div>
    </section>
    <section class="panel panel-5" data-scene="5">
      <div class="veil"><div class="lock">5</div></div>
      <div class="caption">瑞德站在墨西哥的沙滩上，露出了前所未有的笑容——他终于只是瑞德，不再是肖申克的30265号。</div>
    </section>
    <section class="panel panel-6" data-scene="6">
      <div class="veil"><div class="lock">6</div></div>
      <div class="caption">在温暖的阳光下，在这片没有记忆的海滩，安迪等到了老友瑞德的到来……</div>
    </section>

    <div class="note" aria-hidden="true">安迪：“我需要一个好人帮我实现计划，希望是件好东西，也许是世界上最好的东西，好东西永远不会消逝。”</div>
    <div class="overlay-line os">希望太平洋的海水和我梦中的一样蓝……</div>
    <div class="overlay-line ending">二人在海边相遇，携手开启了新的自由……</div>
    <div class="hint">点击 / 空格 推进</div>
    <div class="final-screen" aria-hidden="true">
      <div class="typewriter" id="typewriter" data-text="你与瑞德在这片没有记忆的海滩享受着一切温馨美好，而你也将带着这份美好，去经营你自己的人生……"></div>
    </div>
  </main>

  <script>
    const stage = document.getElementById('stage');
    const bgm = document.getElementById('bgm');
    const finalScreen = document.querySelector('.final-screen');
    const typewriter = document.getElementById('typewriter');
    const panels = Array.from(document.querySelectorAll('.panel'));
    const finalText = typewriter.dataset.text;
    const maxStep = 7;
    let step = 1;
    let typingTimer = 0;
    let hasStartedAudio = false;

    function playBgm() {
      if (hasStartedAudio) return;
      hasStartedAudio = true;
      bgm.volume = 0.72;
      bgm.play().catch(() => {
        hasStartedAudio = false;
      });
    }

    function stopTypewriter() {
      window.clearTimeout(typingTimer);
      typewriter.textContent = '';
      typewriter.classList.remove('is-done');
      finalScreen.setAttribute('aria-hidden', 'true');
    }

    function startTypewriter() {
      window.clearTimeout(typingTimer);
      typewriter.textContent = '';
      typewriter.classList.remove('is-done');
      finalScreen.setAttribute('aria-hidden', 'false');

      let index = 0;
      function typeNext() {
        typewriter.textContent = finalText.slice(0, index);
        if (index >= finalText.length) {
          typewriter.classList.add('is-done');
          return;
        }
        index += 1;
        typingTimer = window.setTimeout(typeNext, finalText[index - 1] === '，' ? 230 : 92);
      }

      typingTimer = window.setTimeout(typeNext, 620);
    }

    function render() {
      stage.dataset.step = String(step);
      stage.classList.toggle('is-final', step === maxStep);
      document.body.classList.toggle('is-final-mode', step === maxStep);
      panels.forEach((panel) => {
        const scene = Number(panel.dataset.scene);
        panel.classList.toggle('is-revealed', scene <= step);
        panel.classList.toggle('is-current', scene === step);
        panel.classList.toggle('is-past', scene < step);
      });

      if (step === maxStep) {
        startTypewriter();
      } else {
        stopTypewriter();
      }
    }

    function advance() {
      playBgm();
      if (step >= maxStep) return;
      step += 1;
      render();
    }

    stage.addEventListener('click', advance);
    stage.addEventListener('keydown', (event) => {
      if (event.key === ' ' || event.key === 'Enter' || event.key === 'ArrowRight') {
        event.preventDefault();
        advance();
      }
      if (event.key === 'ArrowLeft') {
        event.preventDefault();
        playBgm();
        step = step <= 1 ? maxStep : step - 1;
        render();
      }
    });

    render();
  </script>
</body>
</html>
