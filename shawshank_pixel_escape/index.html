<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Shawshank Pixel Escape</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #game {
      display: block;
      width: min(100vw, calc(100vh * 16 / 9));
      height: min(100vh, calc(100vw * 9 / 16));
      background: #000;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    #developerTool {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      grid-template-columns: 430px 1fr;
      background: rgba(7, 8, 9, 0.72);
      color: #f1eee5;
      font-family: system-ui, "Microsoft YaHei", "PingFang SC", sans-serif;
      touch-action: auto;
    }

    #developerTool.dev-open {
      display: grid;
    }

    #developerTool button,
    #developerTool select,
    #developerTool input,
    #developerTool textarea {
      font: inherit;
    }

    #developerTool button {
      min-height: 34px;
      border: 1px solid #383d42;
      border-radius: 7px;
      background: #2a2e32;
      color: #f1eee5;
      padding: 7px 10px;
      cursor: pointer;
    }

    #developerTool button:hover,
    #developerTool button:focus-visible {
      border-color: #d8b45d;
      outline: none;
    }

    #developerTool button.primary {
      background: #3b3320;
      border-color: #7d642b;
      color: #ffe4a3;
      font-weight: 700;
    }

    #developerTool button.danger {
      background: #39211f;
      border-color: #7e3a34;
      color: #ffc3bc;
    }

    #developerTool button.small {
      min-height: 28px;
      padding: 4px 8px;
      font-size: 12px;
    }

    #developerTool select,
    #developerTool textarea {
      width: 100%;
      border: 1px solid #383d42;
      border-radius: 7px;
      background: #111315;
      color: #f1eee5;
      padding: 8px 9px;
    }

    #developerTool textarea {
      min-height: 132px;
      resize: vertical;
      font-family: Consolas, "Cascadia Mono", monospace;
      font-size: 12px;
      line-height: 1.45;
    }

    .dev-sidebar {
      min-height: 0;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #2b2f34;
      background: #17191b;
    }

    .dev-head {
      display: grid;
      gap: 8px;
      padding: 14px 16px 12px;
      border-bottom: 1px solid #383d42;
      background: #161719;
    }

    .dev-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .dev-title-row h1 {
      margin: 0;
      font-size: 17px;
      letter-spacing: 0;
    }

    .dev-status {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #b6afa0;
      font-size: 12px;
    }

    .dev-dot {
      width: 8px;
      height: 8px;
      flex: 0 0 auto;
      border-radius: 999px;
      background: #e56d5f;
    }

    .dev-dot.ready {
      background: #7ccf7a;
    }

    .dev-tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border-bottom: 1px solid #383d42;
    }

    .dev-tab {
      border: 0;
      border-right: 1px solid #383d42;
      border-radius: 0;
      background: #1b1d20;
      color: #b6afa0;
      font-size: 13px;
      min-height: 39px;
    }

    .dev-tab:last-child {
      border-right: 0;
    }

    .dev-tab.active {
      color: #f1eee5;
      background: #25282c;
      box-shadow: inset 0 -2px 0 #d8b45d;
    }

    .dev-content {
      min-height: 0;
      overflow: auto;
      padding: 14px;
    }

    .dev-pane {
      display: none;
    }

    .dev-pane.active {
      display: block;
    }

    .dev-section {
      margin-bottom: 12px;
      overflow: hidden;
      border: 1px solid #383d42;
      border-radius: 8px;
      background: #1b1d1f;
    }

    .dev-section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 12px;
      border-bottom: 1px solid #383d42;
      background: #202327;
      font-size: 13px;
      font-weight: 700;
    }

    .dev-section-body {
      display: grid;
      gap: 8px;
      padding: 12px;
    }

    .dev-grid-two {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .dev-inline {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: end;
    }

    .dev-list {
      display: grid;
      gap: 7px;
    }

    .dev-preset {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      text-align: left;
    }

    .dev-preset strong,
    .dev-preset span {
      display: block;
    }

    .dev-preset span span {
      margin-top: 3px;
      color: #b6afa0;
      font-size: 12px;
      line-height: 1.35;
    }

    .dev-tag {
      align-self: center;
      color: #61c7b5;
      font-size: 12px;
      font-style: normal;
      white-space: nowrap;
    }

    .dev-state-grid {
      display: grid;
      grid-template-columns: 96px 1fr;
      gap: 6px 10px;
      margin: 0;
      font-size: 12px;
    }

    .dev-state-grid dt {
      color: #b6afa0;
    }

    .dev-state-grid dd {
      margin: 0;
      overflow-wrap: anywhere;
    }

    .dev-flags {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px 10px;
      font-size: 12px;
    }

    .dev-flag {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
      color: #f1eee5;
    }

    .dev-flag span {
      overflow-wrap: anywhere;
    }

    .dev-hint {
      margin: 0;
      color: #b6afa0;
      font-size: 12px;
      line-height: 1.5;
    }

    .dev-log {
      min-height: 150px;
      max-height: 220px;
      overflow: auto;
      white-space: pre-wrap;
      border: 1px solid #383d42;
      border-radius: 7px;
      background: #111315;
      color: #b6afa0;
      padding: 8px;
      font-family: Consolas, "Cascadia Mono", monospace;
      font-size: 12px;
      line-height: 1.45;
    }

    .dev-stage {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 14px;
      pointer-events: none;
    }

    .dev-stage-card {
      width: min(720px, 100%);
      border: 1px solid rgba(216, 180, 93, 0.55);
      border-radius: 8px;
      background: rgba(15, 17, 19, 0.88);
      padding: 12px 14px;
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.45);
    }

    .dev-stage-card strong,
    .dev-stage-card span {
      display: block;
    }

    .dev-stage-card span {
      margin-top: 4px;
      color: #b6afa0;
      font-size: 13px;
      line-height: 1.45;
    }

    @media (max-width: 860px) {
      #developerTool {
        grid-template-columns: 1fr;
      }

      .dev-stage {
        display: none;
      }

      .dev-sidebar {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <canvas id="game" width="1280" height="720" aria-label="肖申克像素逃脱"></canvas>
  <script src="./js/main.js"></script>
  <script>
    (function () {
      "use strict";

      const TRIGGER_WINDOW_MS = 1000;
      const REFRESH_MS = 450;
      const CHECKPOINTS = [
        "CP_START",
        "CP_AFTER_WHITE_LIGHT",
        "CP_HAMMER_OBTAINED",
        "CP_BIBLE_OBTAINED",
        "CP_INSPECTION_PASSED",
        "CP_FIRST_DIG",
        "CP_SOIL_DISPOSE",
        "CP_OFFICE_DIALOGUE_DONE",
        "CP_FINAL_DIG",
        "CP_PIPE_GAME",
        "CP_ENDING_SELECT"
      ];
      const FLAG_KEYS = [
        "hasHammer",
        "hasBible",
        "hasLedger",
        "hasSoilPile",
        "bibleUsed",
        "ledgerFound",
        "ledgerSwapped",
        "finalDigUnlocked",
        "inspectionPassed",
        "hasAttributeC",
        "hasAttributeD",
        "twentyYearsPassed",
        "postMontageRedSpoken",
        "mapRevealActive",
        "mapDrawn",
        "hasMap",
        "redHammerDelivered",
        "brooksBibleDelivered"
      ];
      const RAW_SCENES = [
        "menu",
        "livingRoom",
        "recap",
        "whiteLight",
        "cell",
        "yard",
        "dig",
        "montage",
        "office",
        "pipe",
        "pause",
        "fail"
      ];
      const PRESETS = [
        { group: "开场", title: "开始界面", note: "全新状态，停在菜单", code: `devSetProgress({}); devCheckpoint("CP_START"); devEnterScene("menu");` },
        { group: "开场", title: "客厅观影", note: "电视循环阶段，可按 E/空格推进", code: `devSetProgress({}); devCheckpoint("CP_START"); devEnterScene("livingRoom"); GameState.opening.phase = "tvLoop"; GameState.opening.timer = 0; GameState.currentQuest = "quest_living_room_tv";` },
        { group: "开场", title: "剧情回顾分镜", note: "直接进入漫画/字幕推进点", code: `devSetProgress({}); devEnterScene("recap"); GameState.opening.phase = "storyImage"; GameState.opening.timer = 0; GameState.currentQuest = "quest_recap";` },
        { group: "开场", title: "白光转场", note: "吸入电影世界前", code: `devSetProgress({}); devCheckpoint("CP_AFTER_WHITE_LIGHT"); devEnterScene("whiteLight"); GameState.opening.phase = "inhale01"; GameState.opening.timer = 0;` },
        { group: "前期", title: "牢房醒来", note: "无道具，熟悉移动", code: `devSetProgress({}); devCheckpoint("CP_AFTER_WHITE_LIGHT"); devEnterScene("cell"); setPlayerFootToCellImage(620, 920); GameState.currentQuest = "quest_cell_wake";` },
        { group: "前期", title: "首次进入劳作区", note: "找瑞德拿锤子", code: `devSetProgress({}); devCheckpoint("CP_AFTER_WHITE_LIGHT"); devEnterScene("yard"); setPlayerFootToYardImage(360, 710); updateYardCamera(); GameState.currentQuest = "quest_yard_red";` },
        { group: "前期", title: "瑞德交付前", note: "站在瑞德交互区", code: `devSetProgress({}); devEnterScene("yard"); setPlayerFootToYardImage(365, 700); updateYardCamera(); GameState.currentQuest = "quest_yard_red";` },
        { group: "前期", title: "已获得锤子", note: "下一步找老布拿圣经", code: `devSetProgress({ hasHammer: true, redHammerDelivered: true }); devCheckpoint("CP_HAMMER_OBTAINED"); devEnterScene("yard"); setPlayerFootToYardImage(1275, 238); updateYardCamera(); GameState.currentQuest = "quest_yard_library";` },
        { group: "失败分支", title: "查房失败测试", note: "只有锤子，没有圣经", code: `devSetProgress({ hasHammer: true, redHammerDelivered: true }); devCheckpoint("CP_HAMMER_OBTAINED"); devEnterScene("cell"); setPlayerFootToCellImage(620, 520); startCellInspection();` },
        { group: "前期", title: "已获得圣经", note: "回牢房触发查房", code: `devSetProgress({ hasHammer: true, hasBible: true, redHammerDelivered: true, brooksBibleDelivered: true }); devCheckpoint("CP_BIBLE_OBTAINED"); devEnterScene("cell"); setPlayerFootToCellImage(620, 520); GameState.currentQuest = "quest_yard_bible_obtained";` },
        { group: "中期", title: "查房通过", note: "墙画可进入第一次土洞", code: `devSetProgress({ hasHammer: true, hasBible: true, redHammerDelivered: true, brooksBibleDelivered: true, inspectionPassed: true, hasAttributeC: true }); devCheckpoint("CP_INSPECTION_PASSED"); devEnterScene("cell"); setPlayerFootToCellImage(CellLayout.pictureStandPoint.x, CellLayout.pictureStandPoint.y); GameState.currentQuest = "quest_cell_inspection_passed";` },
        { group: "中期", title: "第一次挖洞", note: "站在右侧挖洞区域", code: `devSetProgress({ hasHammer: true, hasBible: true, redHammerDelivered: true, brooksBibleDelivered: true, inspectionPassed: true, hasAttributeC: true }); devCheckpoint("CP_INSPECTION_PASSED"); devEnterScene("dig"); GameState.dig.playerX = DigLayout.digZone.x + DigLayout.digZone.w / 2 - GameState.dig.playerW / 2; GameState.dig.playerY = DigLayout.walkRect.y + 2; GameState.dig.facing = "right"; GameState.currentQuest = "quest_dig_first";` },
        { group: "中期", title: "已挖出小土堆", note: "从左侧出口回牢房", code: `devSetProgress({ hasHammer: true, hasBible: true, hasSoilPile: true, redHammerDelivered: true, brooksBibleDelivered: true, inspectionPassed: true, hasAttributeC: true }); devCheckpoint("CP_FIRST_DIG"); devEnterScene("dig"); GameState.dig.digProgress = DIG_REQUIRED_SECONDS; placeDigPlayerAtSoilPileMoment();` },
        { group: "中期", title: "劳作区撒土", note: "持有土，站在撒土区", code: `devSetProgress({ hasHammer: true, hasBible: true, hasSoilPile: true, redHammerDelivered: true, brooksBibleDelivered: true, inspectionPassed: true, hasAttributeC: true }); devCheckpoint("CP_FIRST_DIG"); devEnterScene("yard"); setPlayerFootToYardImage(820, 456); updateYardCamera(); GameState.currentQuest = "quest_yard_soil";` },
        { group: "失败分支", title: "撒土失败画面", note: "直接进入被狱警发现后的失败状态", code: `devSetProgress({ hasHammer: true, hasBible: true, hasSoilPile: true, redHammerDelivered: true, brooksBibleDelivered: true, inspectionPassed: true, hasAttributeC: true }); devCheckpoint("CP_FIRST_DIG"); devEnterScene("yard"); setPlayerFootToYardImage(820, 456); updateYardCamera(); failSoilDumpByGuard();` },
        { group: "中期", title: "撒土完成", note: "回牢房睡觉触发多年蒙太奇", code: `devSetProgress({ hasHammer: true, hasBible: true, redHammerDelivered: true, brooksBibleDelivered: true, inspectionPassed: true, hasAttributeD: true }); GameState.soilDump.completedCount = SOIL_DUMP_REQUIRED_COUNT; devCheckpoint("CP_SOIL_DISPOSE"); devEnterScene("cell"); setPlayerFootToCellImage(CellLayout.bed.x + CellLayout.bed.w / 2, CellLayout.bed.y + CellLayout.bed.h - 18); GameState.currentQuest = "quest_cell_sleep_after_soil";` },
        { group: "中期", title: "二十年蒙太奇", note: "直接播放长期计划段落", code: `devSetProgress({ hasHammer: true, hasBible: true, redHammerDelivered: true, brooksBibleDelivered: true, inspectionPassed: true, hasAttributeD: true }); devEnterScene("montage");` },
        { group: "后期", title: "二十年后找瑞德", note: "回到劳作区确认下一步计划", code: `devSetProgress({ hasHammer: true, hasBible: true, redHammerDelivered: true, brooksBibleDelivered: true, inspectionPassed: true, twentyYearsPassed: true }); devCheckpoint("CP_SOIL_DISPOSE"); devEnterScene("yard"); setPlayerFootToYardImage(365, 700); updateYardCamera(); GameState.currentQuest = "quest_yard_find_red_after_montage";` },
        { group: "后期", title: "画地图", note: "已和瑞德聊完，回牢房桌前", code: `devSetProgress({ hasHammer: true, hasBible: true, redHammerDelivered: true, brooksBibleDelivered: true, inspectionPassed: true, twentyYearsPassed: true, postMontageRedSpoken: true }); devEnterScene("cell"); setPlayerFootToCellImage(620, 878); GameState.currentQuest = "quest_cell_draw_map";` },
        { group: "后期", title: "已取得地图", note: "可进入典狱长办公室", code: `devSetProgress({ hasHammer: true, hasBible: true, redHammerDelivered: true, brooksBibleDelivered: true, inspectionPassed: true, twentyYearsPassed: true, postMontageRedSpoken: true, mapDrawn: true, hasMap: true }); devEnterScene("yard"); setPlayerFootToYardImage(164, 610); updateYardCamera(); GameState.currentQuest = "quest_cell_map_obtained";` },
        { group: "后期", title: "办公室对话前", note: "站在典狱长旁", code: `devSetProgress({ hasHammer: true, hasBible: true, redHammerDelivered: true, brooksBibleDelivered: true, inspectionPassed: true, twentyYearsPassed: true, postMontageRedSpoken: true, mapDrawn: true, hasMap: true }); devEnterScene("office"); setPlayerFootToOfficeImage(760, 626); GameState.currentQuest = "quest_office_warden";` },
        { group: "后期", title: "典狱长已离开", note: "检查刺绣找到账本", code: `devSetProgress({ hasHammer: true, hasBible: true, redHammerDelivered: true, brooksBibleDelivered: true, inspectionPassed: true, twentyYearsPassed: true, postMontageRedSpoken: true, mapDrawn: true, hasMap: true }); devCheckpoint("CP_OFFICE_DIALOGUE_DONE"); devEnterScene("office"); GameState.office.wardenPhase = "gone"; GameState.office.wardenX = OfficeLayout.wardenExit.x; GameState.office.wardenY = OfficeLayout.wardenExit.y; setPlayerFootToOfficeImage(166, 520); GameState.currentQuest = "quest_office_embroidery";` },
        { group: "后期", title: "保险柜账本界面", note: "可点击账本完成调包", code: `devSetProgress({ hasHammer: true, hasBible: true, redHammerDelivered: true, brooksBibleDelivered: true, inspectionPassed: true, twentyYearsPassed: true, postMontageRedSpoken: true, mapDrawn: true, hasMap: true, ledgerFound: true }); devCheckpoint("CP_OFFICE_DIALOGUE_DONE"); devEnterScene("office"); GameState.office.wardenPhase = "gone"; GameState.office.wardenX = OfficeLayout.wardenExit.x; GameState.office.wardenY = OfficeLayout.wardenExit.y; GameState.office.embroideryChecked = true; GameState.office.safeViewOpen = true; GameState.office.safeStage = "ledgerFound"; GameState.currentQuest = "quest_office_swap_ledger";` },
        { group: "后期", title: "已完成账本调包", note: "回牢房进入最终土洞", code: `devSetProgress({ hasHammer: true, hasBible: true, hasLedger: true, bibleUsed: true, ledgerFound: true, ledgerSwapped: true, finalDigUnlocked: true, redHammerDelivered: true, brooksBibleDelivered: true, inspectionPassed: true, hasAttributeC: true, twentyYearsPassed: true, postMontageRedSpoken: true, mapDrawn: true, hasMap: true }); devCheckpoint("CP_FINAL_DIG"); devEnterScene("cell"); setPlayerFootToCellImage(CellLayout.pictureStandPoint.x, CellLayout.pictureStandPoint.y); GameState.currentQuest = "quest_cell_final_dig_ready";` },
        { group: "终段", title: "最终土洞", note: "走到最右侧进入水管", code: `devSetProgress({ hasHammer: true, hasBible: true, hasLedger: true, bibleUsed: true, ledgerFound: true, ledgerSwapped: true, finalDigUnlocked: true, redHammerDelivered: true, brooksBibleDelivered: true, inspectionPassed: true, hasAttributeC: true, twentyYearsPassed: true, postMontageRedSpoken: true, mapDrawn: true, hasMap: true }); devCheckpoint("CP_FINAL_DIG"); devEnterScene("dig"); GameState.dig.mode = "finalTunnel"; GameState.dig.playerX = FinalDigLayout.entryZone.x + FinalDigLayout.entryZone.w / 2 - GameState.dig.playerW / 2; GameState.dig.playerY = FinalDigLayout.walkRect.y; GameState.currentQuest = "quest_final_tunnel";` },
        { group: "终段", title: "水管砸击点", note: "站到黄色交互区", code: `devSetProgress({ hasHammer: true, hasBible: true, hasLedger: true, bibleUsed: true, ledgerFound: true, ledgerSwapped: true, finalDigUnlocked: true, redHammerDelivered: true, brooksBibleDelivered: true, inspectionPassed: true, hasAttributeC: true, twentyYearsPassed: true, postMontageRedSpoken: true, mapDrawn: true, hasMap: true }); devCheckpoint("CP_PIPE_GAME"); devEnterScene("pipe"); GameState.pipe.playerX = PipeLayout.smashZone.x + PipeLayout.smashZone.w / 2 - GameState.pipe.playerW / 2; GameState.pipe.playerY = PipeLayout.walkRect.y + 2; GameState.pipe.facing = "right"; GameState.currentQuest = "quest_pipe_tunnel";` },

        if (!isSixKey(event) || isEditableTarget(event.target)) {

        const now = Date.now();
        sixPressTimes = sixPressTimes.filter((time) => now - time <= TRIGGER_WINDOW_MS);
        sixPressTimes.push(now);
        if (sixPressTimes.length >= 3) {
          sixPressTimes = [];
          setToolOpen(true);
          event.preventDefault();
          event.stopImmediatePropagation();
        }

        devClearInput();
        devClearDialogue();
        const previous = GameState.scene;
        if (previous !== sceneName && typeof changeScene === "function") {
          changeScene(sceneName);
          return;
        }
        GameState.previousScene = previous;
        GameState.scene = sceneName;
        if (Scenes[sceneName] && Scenes[sceneName].enter) {
          Scenes[sceneName].enter();
        }
      }

            devMerge(target[key], value);
          } else {
            target[key] = value;
          }
        });
        return target;

            phase: GameState.pipe.phase,
            hits: GameState.pipe.smashSuccessCount,
            requiredHits: typeof PIPE_SMASH_REQUIRED_COUNT === "undefined" ? 0 : PIPE_SMASH_REQUIRED_COUNT,
            cueVisible: GameState.pipe.cueVisible,
            cueLit: GameState.pipe.cueLit,
            smashCompleted: GameState.pipe.smashCompleted,
            victoryPhase: GameState.pipe.victoryPhase
          },
          flags: FLAG_KEYS.reduce(function (result, key) {
            result[key] = Boolean(GameState[key]);
            return result;
          }, {}),
          raw: GameState
        };
      }

      function runCode(label, code) {
        try {
          eval(code);
          devRestartLoop();
          log("OK " + label);
          refreshState();
        } catch (error) {
          log("ERR " + label + ": " + (error && error.message ? error.message : error));
          setReady(false, "执行失败");
        }
      }

      function setReady(value, text) {
        const dot = document.getElementById("devReadyDot");
        const readyText = document.getElementById("devReadyText");
        if (dot) dot.className = value ? "dev-dot ready" : "dev-dot";
        if (readyText) readyText.textContent = text;
      }

      function log(message) {
        const logBox = document.getElementById("devLog");
        if (!logBox) return;
        const time = new Date().toLocaleTimeString();
        logBox.textContent = "[" + time + "] " + message + "\n" + logBox.textContent;
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function renderButtonList(id, items, tagText) {
        const list = document.getElementById(id);
        list.innerHTML = "";
        items.forEach(function (item) {
          const button = document.createElement("button");
          button.className = "dev-preset";
          button.innerHTML = "<span><strong>" + escapeHtml(item.title) + "</strong><span>" + escapeHtml(item.note || "") + "</span></span><em class=\"dev-tag\">" + escapeHtml(tagText || item.group || "") + "</em>";
          button.addEventListener("click", function () {
            runCode(item.title, item.code);
          });
          list.appendChild(button);
        });
      }

      function renderStaticControls() {
        renderButtonList("devPresetList", PRESETS);
        renderButtonList("devTeleportList", TELEPORTS, "移动");
        const shortcutList = document.getElementById("devShortcutList");
        shortcutList.innerHTML = "";
        SHORTCUTS.forEach(function (item) {
          const button = document.createElement("button");
          button.textContent = item.title;
          button.addEventListener("click", function () {
            runCode(item.title, item.code);
          });
          shortcutList.appendChild(button);
        });
        document.getElementById("devSceneSelect").innerHTML = RAW_SCENES.map(function (scene) {
          return "<option value=\"" + scene + "\">" + scene + "</option>";
        }).join("");
        document.getElementById("devCheckpointSelect").innerHTML = CHECKPOINTS.map(function (checkpoint) {
          return "<option value=\"" + checkpoint + "\">" + checkpoint + "</option>";
        }).join("");
      }

      function renderFlags(flags) {
        if (flagsDirty) return;
        const flagList = document.getElementById("devFlagList");
        flagList.innerHTML = "";
        FLAG_KEYS.forEach(function (key) {
          const label = document.createElement("label");
          label.className = "dev-flag";
          label.innerHTML = "<input type=\"checkbox\" data-flag=\"" + key + "\"> <span>" + key + "</span>";
          const input = label.querySelector("input");
          input.checked = Boolean(flags && flags[key]);
          input.addEventListener("change", function () {
            flagsDirty = true;
          });
          flagList.appendChild(label);
        });
      }

      function refreshState() {
        if (!root || !root.classList.contains("dev-open")) return;
        const state = readState();
        if (!state.ready) {
          setReady(false, "等待 GameState");
          return;
        }
        const rows = [
          ["scene", state.scene],
          ["quest", state.quest],
          ["questText", state.questText],
          ["checkpoint", state.checkpoint],
          ["active", state.activeInteraction || "none"],
          ["player", state.player.x + "," + state.player.y + " / " + state.player.facing],
          ["dig", state.dig.mode + " / " + state.dig.progress],
          ["soil", state.soilDump.completedCount + "/3 / " + state.soilDump.progress],
          ["office", state.office.wardenPhase + " / " + state.office.safeStage],
          ["pipe", state.pipe.phase + " / " + state.pipe.hits + "/" + state.pipe.requiredHits + " / cue " + (state.pipe.cueLit ? "lit" : state.pipe.cueVisible ? "wait" : "off") + " / " + state.pipe.x + "," + state.pipe.y + (state.pipe.smashCompleted ? " / opened" : "") + (state.pipe.victoryPhase && state.pipe.victoryPhase !== "none" ? " / victory " + state.pipe.victoryPhase : "")],
          ["fail", state.failReason || "none"],
          ["playTime", state.playTime + "s"]
        ];
        document.getElementById("devStateSummary").innerHTML = rows.map(function (row) {
          return "<dt>" + escapeHtml(row[0]) + "</dt><dd>" + escapeHtml(String(row[1])) + "</dd>";
        }).join("");
        renderFlags(state.flags);
        document.getElementById("devStageTitle").textContent = "scene: " + state.scene + " | checkpoint: " + state.checkpoint;
        document.getElementById("devStageSubtitle").textContent = state.questText || state.quest;
        document.getElementById("devSceneSelect").value = state.scene;
        document.getElementById("devCheckpointSelect").value = CHECKPOINTS.indexOf(state.checkpoint) >= 0 ? state.checkpoint : "CP_START";
        setReady(!state.fatalError, state.fatalError ? "游戏报错：" + state.fatalError : "已连接 GameState");
      }

      function applyFlagForm() {
        const patch = {};
        document.querySelectorAll("#devFlagList input[data-flag]").forEach(function (input) {
          patch[input.dataset.flag] = input.checked;
        });
        flagsDirty = false;
        Object.keys(patch).forEach(function (key) {
          GameState[key] = patch[key];
        });
        log("OK 应用旗标");
        refreshState();
      }

      function applyJsonPatch() {
        try {
          const patch = JSON.parse(document.getElementById("devPatchText").value);
          devMerge(GameState, patch);
          log("OK JSON 补丁");
          refreshState();
        } catch (error) {
          log("ERR JSON 格式错误: " + (error && error.message ? error.message : error));
        }
      }

      function dumpStateToPatch() {
        try {
          document.getElementById("devPatchText").value = JSON.stringify(readState().raw, null, 2);
          log("OK 已填入当前 GameState");
        } catch (error) {
          log("ERR 读取状态失败: " + (error && error.message ? error.message : error));
        }
      }

      function bindTool() {
        document.getElementById("devClose").addEventListener("click", function () { setToolOpen(false); });
        document.querySelectorAll(".dev-tab").forEach(function (tab) {
          tab.addEventListener("click", function () {
            activePane = tab.dataset.pane;
            document.querySelectorAll(".dev-tab").forEach(function (item) {
              item.classList.toggle("active", item === tab);
            });
            document.querySelectorAll(".dev-pane").forEach(function (pane) {
              pane.classList.toggle("active", pane.id === "devPane-" + activePane);
            });
          });
        });
        document.getElementById("devRefreshProgress").addEventListener("click", refreshState);
        document.getElementById("devRefreshState").addEventListener("click", refreshState);
        document.getElementById("devSceneButton").addEventListener("click", function () {
          runCode("切场景 " + document.getElementById("devSceneSelect").value, "devEnterScene(" + JSON.stringify(document.getElementById("devSceneSelect").value) + ");");
        });
        document.getElementById("devCheckpointButton").addEventListener("click", function () {
          const checkpoint = document.getElementById("devCheckpointSelect").value;
          devCheckpoint(checkpoint);
          log("OK 保存检查点 " + checkpoint);
          refreshState();
        });
        document.getElementById("devApplyFlags").addEventListener("click", applyFlagForm);
        document.getElementById("devApplyPatch").addEventListener("click", applyJsonPatch);
        document.getElementById("devDumpState").addEventListener("click", dumpStateToPatch);
        document.getElementById("devRunScript").addEventListener("click", function () {
          runCode("运行时 JS", document.getElementById("devScriptText").value);
        });
      }

      window.addEventListener("keydown", handleTrigger, true);
    })();
  </script>
</body>
</html>
