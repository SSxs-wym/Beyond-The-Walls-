<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="data:,">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>希望之路｜驾车前往边境</title>
  <style>html,body,#gameHost{margin:0;width:100%;height:100%;overflow:hidden;background:#050705;touch-action:none}</style>
</head>
<body>
  <main id="gameHost"></main>
  <script src="../shared/global-controls.js"></script>
  <script src="./ending-one-games.js"></script>
  <script>
    (function(){
      let controls=null;
      const game=window.BeyondWallsEndingOneGames.mountRoute(document.getElementById("gameHost"),{
        embedded:false,
        onContext:function(context){if(controls)controls.setContext(context)}
      });
      controls=window.BeyondWallsControls.mount({adapter:{
        onMove:function(payload){game.setMove(payload)},
        onActionDown:function(){game.actionDown()},
        onActionUp:function(){game.actionUp()}
      }});
      function key(event){
        const value=typeof event.key==="string"?event.key.toLowerCase():"";
        if(!["w","a","s","d"," "].includes(value))return;
        if(event.type==="keydown")game.keyDown(value,event.repeat);else game.keyUp(value);
        event.preventDefault();
      }
      window.addEventListener("keydown",key,true);window.addEventListener("keyup",key,true);
      window.addEventListener("pagehide",function(){controls.destroy();game.destroy()},{once:true});
    })();
  </script>
</body>
</html>
